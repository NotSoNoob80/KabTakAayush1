    }
    var _reachEuroX = makeOneEuro(REACH_EURO_MIN_CUTOFF, REACH_EURO_BETA, REACH_EURO_DCUTOFF);
    var _reachEuroY = makeOneEuro(REACH_EURO_MIN_CUTOFF, REACH_EURO_BETA, REACH_EURO_DCUTOFF);
    var _reachEuroSize = makeOneEuro(REACH_EURO_SIZE_MIN_CUTOFF, REACH_EURO_SIZE_BETA, REACH_EURO_SIZE_DCUTOFF);

    function reachInitDom() {
      reach.ctaEl       = document.getElementById('reach-cta');
      reach.ctaLabelEl  = reach.ctaEl ? reach.ctaEl.querySelector('.reach-cta__label') : null;
      reach.guideEl     = document.getElementById('reach-guide');
      reach.onboardEl   = document.getElementById('reach-onboard');
      reach.identifyEl  = document.getElementById('reach-identify');
      reach.indicatorEl = document.getElementById('reach-indicator');
      reach.reticleEl   = document.getElementById('reach-reticle');
      reach.hintEl      = document.getElementById('reach-hint');
      if (!reach.ctaEl) return;

      if (REACH_PREFERS_REDUCED) {
        // CSS already hides it, but make doubly sure we never wire it up.
        return;
      }

      reach.ctaEl.addEventListener('click', function () {
        if (reach.starting) return;
        if (reach.enabled) disableReach();
        else enableReach();
      });

      if (REACH_PREWARM && !IS_MOBILE) {
        // Speculative warm-up: start the wasm + model fetch while the visitor
        // is still deciding, so the click lands on a warm cache. Failures are
        // swallowed — loadHandLandmarker clears its cached promise on error,
        // so the real click (or the next hover) retries from scratch. The
        // camera is NOT touched here; only the model loads.
        reach.ctaEl.addEventListener('pointerenter', function () {
          loadHandLandmarker().catch(function () {});
        });
      }
    }

    function showReachCta() {
      if (REACH_PREFERS_REDUCED) return;
      if (!reach.ctaEl) return;
      reach.ctaEl.classList.add('is-visible');
    }

    function setReachCtaState(state) {
      if (!reach.ctaEl) return;
      reach.ctaEl.classList.remove('is-on', 'is-failed');
      var labelEl = reach.ctaLabelEl;
      if (state === 'on') {
        reach.ctaEl.classList.add('is-on');
        if (labelEl) labelEl.textContent = 'Release · Esc';
        reach.ctaEl.setAttribute('aria-pressed', 'true');
      } else if (state === 'failed-perm') {
        reach.ctaEl.classList.add('is-failed');
        if (labelEl) labelEl.textContent = 'Camera blocked';
        reach.ctaEl.setAttribute('aria-pressed', 'false');
      } else if (state === 'failed-model') {
        reach.ctaEl.classList.add('is-failed');
        if (labelEl) labelEl.textContent = 'Hand model failed';
        reach.ctaEl.setAttribute('aria-pressed', 'false');
      } else {
        if (labelEl) labelEl.textContent = 'The Reach';
        reach.ctaEl.setAttribute('aria-pressed', 'false');
      }
    }

    function loadHandLandmarker() {
      if (_reachLandmarkerPromise) return _reachLandmarkerPromise;
      _reachLandmarkerPromise = import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs')
        .then(function (vision) {
          return vision.FilesetResolver
            .forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm')
            .then(function (fileset) {
              return vision.HandLandmarker.createFromOptions(fileset, {
                baseOptions: {
                  modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
                  delegate: IS_MOBILE ? 'CPU' : 'GPU'
                },
                runningMode: 'VIDEO',
                numHands: 1,
                // Be "stickier" so a fast, motion-blurred hand isn't dropped
                // (which forces a slow full re-search — the ~1s recovery gap).
                // These only change how readily the tracker holds/re-grabs the
                // hand; they add no extra work, so they don't cost frame rate.
                // Defaults are 0.5; lower = holds through blur and re-acquires
                // faster, at the cost of occasionally clinging a beat too long.
                minHandDetectionConfidence: 0.4,
                minHandPresenceConfidence: 0.3,
                minTrackingConfidence: 0.3
              });
            });
        })
        .catch(function (err) {
          _reachLandmarkerPromise = null;
          throw err;
        });
      return _reachLandmarkerPromise;
    }

    function enableReach() {
      if (reach.enabled || reach.starting) return;
      reach.starting = true;
      hideUiForever();

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        reach.starting = false;
        setReachCtaState('failed-perm');
        return;
      }

      // Capture size: a larger frame gives the landmarker more pixels to lock
      // onto, so the hand and its finger pose read more accurately (better
      // gesture discrimination, fewer drops). detectForVideo() runs on the main
      // thread and its cost scales with pixel count, so this trades a little
      // render headroom for detection quality. "ideal" is a soft hint — the
      // browser picks the nearest supported size and never fails outright.
      navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'user',
          width:  { ideal: 640 },
          height: { ideal: 480 }
        }
      })
        .then(function (stream) {
          reach.stream = stream;
          var v = document.createElement('video');
          v.autoplay    = true;
          v.muted       = true;
          v.playsInline = true;
          v.setAttribute('playsinline', '');   // iOS Safari needs the attribute too
          v.setAttribute('muted', '');
          // iOS Safari won't advance frames unless the element is in the DOM.
          v.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;top:0;left:0;';
          document.body.appendChild(v);
          v.srcObject   = stream;
          reach.videoEl = v;
          if (reach.indicatorEl) reach.indicatorEl.classList.add('is-on');
          if (reach.reticleEl)   reach.reticleEl.classList.add('is-on');
          return v.play().then(function () { return loadHandLandmarker(); });
        })
        .then(function (landmarker) {
          reach.landmarker  = landmarker;
          reach.enabled     = true;
          reach.starting    = false;
          reach.calib       = null;
          reach.calibSamples = [];
          reach.lastSeenAt  = performance.now();
          reach.lastDetectAt = 0;
          reach.nextDetectAt = 0;   // first camera frame detects immediately — fastest possible acquire
          reach.lastFrameCbAt = 0;
          setReachCtaState('on');
          // The Reach is now live: the gesture guide replaces the
          // scroll/drag/click hint for as long as we are streaming.
          if (reach.guideEl) reach.guideEl.classList.add('is-visible');
          var voidHintOnEnable = document.getElementById('void-hint');
          if (voidHintOnEnable) voidHintOnEnable.classList.remove('is-visible');
          // First, the acquisition cue ("Identifying powers") while we search
          // for the hand. The gesture onboard fires later, once the hand is
          // actually locked in (see calibration in reachDetect).
          reachShowIdentify();
          reachScheduleDetection();
        })
        .catch(function (err) {
          var perm = !!(err && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError' || err.name === 'NotFoundError'));
          reachTeardown();
          setReachCtaState(perm ? 'failed-perm' : 'failed-model');
        });
    }

    function disableReach() {
      if (!reach.enabled && !reach.starting) return;
      reachTeardown();
      setReachCtaState('off');
    }

    function reachTeardown() {
      reach.enabled  = false;
      reach.starting = false;
      if (reach.loopTimer) { clearTimeout(reach.loopTimer); reach.loopTimer = null; }
      if (reach.stream) {
        var tracks = reach.stream.getTracks();
        for (var i = 0; i < tracks.length; i++) tracks[i].stop();
        reach.stream = null;
      }
      if (reach.videoEl) {
        try { reach.videoEl.pause(); } catch (e) {}
        reach.videoEl.srcObject = null;
        if (reach.videoEl.parentNode) reach.videoEl.parentNode.removeChild(reach.videoEl);
        reach.videoEl = null;
      }
      if (reach.indicatorEl) reach.indicatorEl.classList.remove('is-on');
      if (reach.reticleEl)   reach.reticleEl.classList.remove('is-on', 'is-pushing', 'is-clutched', 'is-palm', 'is-fist');
      if (reach.guideEl)     reach.guideEl.classList.remove('is-visible');
      reachClearHint();
      reachClearOnboard();
      reachClearIdentify();
      reach.hand     = null;
      reach.handRaw  = null;
      reach.handRender = null;
      reach.sizeRender = null;
      reach.snapSizeOnNext = false;
      reach.lastApplyTs = 0;
      reach.lastDetectAt = 0;
      reach.nextDetectAt = 0;
      reach.lastFrameCbAt = 0;
      _reachEuroX.reset();
      _reachEuroY.reset();
      _reachEuroSize.reset();
      reach.clutched = false;
      reach.clutchSince = 0;
      reach.openSince   = 0;
      reach.recalibSizeOnNext = false;
      reach.wasFocused = false;
      reach.calib    = null;
      reach.calibSamples = null;
    }

    function reachScheduleDetection() {
      if (!reach.enabled) return;
      var interval = Math.max(16, Math.round(1000 / REACH_DETECTION_HZ));
      var v = reach.videoEl;
      var useRvfc = !!(REACH_USE_RVFC && v && v.requestVideoFrameCallback);

      if (useRvfc) {
        // Frame-aligned path: wake exactly when the camera presents a new
        // frame, so inference always reads a fresh image — the timer loop
        // sampled frames up to a full detection interval stale and beat
        // against the camera's cadence. The accumulator keeps the average
        // rate at the detection budget (a 60fps camera does NOT double the
        // inference cost); capping the schedule at `now` makes a stall
        // resume at the budget instead of bursting to catch up. The chain
        // dies naturally on teardown: enabled flips false and the videoEl
        // identity check also kills a stale chain on a quick re-enable.
        (function armFrame() {
          v.requestVideoFrameCallback(function (now) {
            if (!reach.enabled || reach.videoEl !== v) return;
            reach.lastFrameCbAt = now;
            if (now >= reach.nextDetectAt) {
              reach.nextDetectAt += interval;
              if (reach.nextDetectAt < now) reach.nextDetectAt = now;
              reachDetect();
            }
            armFrame();   // re-arm for the next camera frame
          });
        })();
      }

      // Timer loop: the sole driver where rVFC is unsupported (exactly the
      // old behavior). With rVFC it stays armed as a silent backstop that
      // performs no inference while frame callbacks are alive, but takes
      // over at the full budget cadence if they starve (a browser that
      // suppresses callbacks for invisible videos, a paused pipeline) — so
      // detection can never die with the camera still streaming. 300ms is
      // generous against slow low-light cameras (~15fps ⇒ 66ms gaps) yet
      // under REACH_DETECT_STALE_MS, so a takeover happens before the
      // staleness guard would drop the hand.
      (function armTimer() {
        reach.loopTimer = setTimeout(function () {
          if (!reach.enabled || reach.videoEl !== v) return;
          if (!useRvfc) {
            reachDetect();
          } else if (!reach.lastFrameCbAt ||
                     (performance.now() - reach.lastFrameCbAt) > REACH_RVFC_BACKSTOP_MS) {
            reachDetect();
          }
          armTimer();
        }, interval);
      })();
    }

    function reachDetect() {
      if (!reach.enabled || !reach.videoEl || !reach.landmarker) return;
      if (reach.videoEl.readyState < 2) return;
      var ts = performance.now();
      reach.lastDetectAt = ts;   // inference is actually running — feeds the staleness guard
      var result;
      try {
        result = reach.landmarker.detectForVideo(reach.videoEl, ts);
      } catch (e) { return; }
      var lms = result && result.landmarks && result.landmarks[0];
      if (!lms || !lms.length) {
        reach.hand = null;
        return;
      }
      reach.lastSeenAt = ts;

      // Palm centre ≈ middle-finger MCP (landmark 9). Mirror x for selfie view.
      var palm   = lms[9];
      var wrist  = lms[0];

      var palmX = 1 - palm.x;
      var palmY = palm.y;

      // Hand "size" = apparent wrist→knuckle scale; bigger ⇒ hand nearer ⇒ depth.
      var size;
      if (REACH_ROBUST_SIZE) {
        // Average the wrist→MCP span of all four fingers (index 5, middle 9,
        // ring 13, pinky 17). They're the same KIND of measure, so they scale
        // together with distance and combine cleanly; averaging cancels the
        // independent per-landmark jitter (~half the noise) at zero lag cost.
        // MCPs barely move as fingers curl, so size stays steady through
        // fist/open too. Calibration uses this same metric, so the small
        // absolute-scale shift vs the single span cancels in ds = size - calib.
        var MCP = [5, 9, 13, 17];
        var sSum = 0;
        for (var si = 0; si < MCP.length; si++) {
          var mc  = lms[MCP[si]];
          var mdx = (1 - mc.x) - (1 - wrist.x);
          var mdy = mc.y - wrist.y;
          sSum += Math.sqrt(mdx * mdx + mdy * mdy);

      } else {
        var dx = (1 - palm.x) - (1 - wrist.x);
        var dy = palm.y - wrist.y;
        size = Math.sqrt(dx * dx + dy * dy);
      }

      // Openness signals: mean tip→MCP distance, normalised by hand size.
      //   curl    — fingers 2-5 (index..pinky), used to set the calibrated
      //             neutral and to read overall hand openness.
      //   curl345 — fingers 3-5 (middle, ring, pinky) ONLY. This is the
      //             pinch/fist discriminator: a pinch curls the INDEX to meet
      //             the thumb but keeps 3-5 extended, a fist curls 3-5 too.
      //             Gating on curl345 means a pinch's curled index no longer
      //             looks like a partial fist and no longer blocks the pinch.
      var FINGER_LM = [[8, 5], [12, 9], [16, 13], [20, 17]];
      var curlSum = 0, curl345Sum = 0;
      for (var f = 0; f < FINGER_LM.length; f++) {
        var tip = lms[FINGER_LM[f][0]];
        var mcp = lms[FINGER_LM[f][1]];
        var fx = tip.x - mcp.x;
        var fy = tip.y - mcp.y;
        var fd = Math.sqrt(fx * fx + fy * fy);
        curlSum += fd;
        if (f >= 1) curl345Sum += fd;   // skip index (f === 0)
      }
      var curl    = (size > 1e-6) ? (curlSum / 4) / size : 0;
      var curl345 = (size > 1e-6) ? (curl345Sum / 3) / size : 0;

      // Calibration: average the first ~12 samples to set neutral
      if (!reach.calib) {
        reach.calibSamples.push({ x: palmX, y: palmY, size: size, curl: curl });
        if (reach.calibSamples.length >= 12) {
          var sx = 0, sy = 0, ss = 0, sc = 0, n = reach.calibSamples.length;
          for (var k = 0; k < n; k++) {
            sx += reach.calibSamples[k].x;
            sy += reach.calibSamples[k].y;
            ss += reach.calibSamples[k].size;
            sc += reach.calibSamples[k].curl;
          }
          reach.calib = { x: sx / n, y: sy / n, size: ss / n, curl: sc / n };
          reach.calibSamples = null;

          // to the gesture guide now that there's a hand to demonstrate with.
          reachClearIdentify();
          reachShowOnboard();

        return;

      // Smoothed update
      var prev = reach.hand;
      var next = { x: palmX, y: palmY, size: size, curl: curl, curl345: curl345 };
      if (prev) {
        next.x       = prev.x       + (palmX     - prev.x)       * REACH_SMOOTH;
        next.y       = prev.y       + (palmY     - prev.y)       * REACH_SMOOTH;
        next.size    = prev.size    + (size      - prev.size)    * REACH_SMOOTH;
        next.curl    = prev.curl    + (curl      - prev.curl)    * REACH_SMOOTH;
        next.curl345 = prev.curl345 + (curl345   - prev.curl345) * REACH_SMOOTH;

      reach.hand = next;
      // Stash the unsmoothed palm for the glide: One Euro filters this at render
      // rate, so x/y smoothing is owned entirely by the adaptive filter while
      // size/curl keep their REACH_SMOOTH treatment for the clutch/depth path.
      reach.handRaw = { x: palmX, y: palmY };

      // ADR 0011: on the first sample after a clutched→open transition, the
      // open-palm size anchor has drifted (visitor may have shifted distance,
      // or the hand was a fist a frame ago). Re-anchor calib.size to the
      // current smoothed size so the depth contribution starts from ~0 and
      // does not jerk the camera forward or backward.
      if (reach.recalibSizeOnNext) {
        reach.calib.size = next.size;
        reach.recalibSizeOnNext = false;
        reach.snapSizeOnNext = true;   // snap the depth glide to the new anchor → ds≈0, no z jerk
      }

      // Clutch state machine.
      //
      // Two named states: open and clutched. A fist (fingers 3-5 curled, low
      // curl345) pins depth; an open palm steers normally. Anything between is
      // ambiguous and produces no transition, so the previous state holds.
      //
      // Transitions are gated by hysteresis bands AND an intention-dwell of
      // REACH_CLUTCH_DWELL_MS so a stray curl during a normal steer does not
      // pin the camera under the visitor.
      var curlNeutral = reach.calib.curl;
      var openCurl    = curlNeutral * REACH_CURL_OPEN_RATIO;
      var fistCurl    = curlNeutral * REACH_CURL_FIST_RATIO;

      // Open ↔ clutched with intention-dwell. Fingers 3-5 are the discriminator:
      // a fist curls them (curl345 low), an open palm extends them.
      if (!reach.clutched) {
        if (next.curl345 < fistCurl) {
          if (!reach.clutchSince) reach.clutchSince = ts;
          else if (ts - reach.clutchSince >= REACH_CLUTCH_DWELL_MS) {
            reach.clutched    = true;
            reach.clutchSince = 0;
          }
        } else {
          reach.clutchSince = 0;
        }
        reach.openSince = 0;
      } else {
        if (next.curl345 > openCurl) {
          if (!reach.openSince) reach.openSince = ts;
          else if (ts - reach.openSince >= REACH_CLUTCH_DWELL_MS) {
            reach.clutched          = false;
            reach.openSince         = 0;
            reach.recalibSizeOnNext = true;   // ADR 0011: re-anchor on next sample
          }
        } else {
          reach.openSince = 0;
        }
        reach.clutchSince = 0;
      }
    }

    function reachApplyToTarget() {
      if (!reach.enabled) return;
      if (focused) {
        // Focus owns the camera; The Reach contributes nothing. Also clear
        // any clutch state so releasing Focus does not leave a stale clutch
        // ring on the reticle, even if the visitor's hand happened to be in
        // a fist at the moment Focus was entered.
        if (reach.clutched || reach.clutchSince || reach.openSince) {
          reach.clutched    = false;
          reach.clutchSince = 0;
          reach.openSince   = 0;
        }

        reach.wasFocused = true;
        return;

      // Staleness guard: the frame-aligned scheduler only ticks when camera
      // frames arrive. If frames stop (capture stall, device sleep) the last
      // hand sample would otherwise steer the Void forever — treat a silent
      // detector as a lost hand so the field coasts to rest instead of
      // drifting on a stale offset. Harmless on the timer path, where
      // inference keeps running and refreshes lastDetectAt regardless.

        _reachEuroSize.reset();

          reach.reticleEl.classList.remove('is-pushing');
          // Calibrating (or briefly lost): drop back to the plain circle
          // cursor — no gesture class until detection re-stabilises.
          reach.reticleEl.classList.remove('is-palm', 'is-fist');
          // Clutch ring survives short tracking losses (a sneeze, a flicker,
          // a missed frame) — only fade it once we have actually auto-released.
          if (!(withinGrace && reach.clutched)) {
            reach.reticleEl.classList.remove('is-clutched');
          }
        }
        if (reach.lastSeenAt && lostFor > REACH_LOSS_HINT_MS) {
          // Long loss: auto-release the clutch and queue a fresh calibration
          // of all four calib fields on re-detection — the visitor has
          // probably repositioned, so x/y/size/curl all need re-anchoring.
          if (reach.clutched || reach.calib) {
            reach.clutched          = false;
            reach.clutchSince       = 0;
            reach.openSince         = 0;
            reach.recalibSizeOnNext = false;
            reach.calib             = null;
            reach.calibSamples      = [];
          }
          reachShowHint();
        }
        return;
      }
      reachClearHint();

      // Just came out of Focus: the hand has almost certainly moved or changed
      // apparent size while the pinch/Focus held the camera, so re-anchor the
      // depth reference on the next sample — the same trick the clutch uses
      // (ADR 0011). Without this, resuming from Focus jerks z forward/back.
      if (reach.wasFocused) {
        reach.wasFocused = false;
        reach.recalibSizeOnNext = true;
      }

      // Per-frame glide via One Euro: the render loop runs at ~60fps but
      // detection only refreshes the hand at the detection Hz, so reading the
      // sample straight would step the cursor/void. Re-filtering the latest raw
      // position every frame resamples it to render rate with adaptive
      // smoothing — steady when the hand rests, lag-free when it moves — and is
      // framerate-independent. Size/depth still read reach.hand directly, so the
      // clutch and ADR 0011 re-anchoring are untouched. The filter returns the
      // raw value on its first call after a reset, so a fresh acquire snaps.
      var src = reach.handRaw || reach.hand;
      var now = performance.now();
      var hr  = reach.handRender || (reach.handRender = { x: src.x, y: src.y });
      hr.x = _reachEuroX.filter(src.x, now);
      hr.y = _reachEuroY.filter(src.y, now);

      // Real frame dt (clamped against a stall) drives the dt-scaled push so
      // depth's fly RATE no longer rides the frame rate the heavier detection
      // costs. (The size filter below tracks its own dt internally.)
      var dtMs = reach.lastApplyTs ? (now - reach.lastApplyTs) : (1000 / 60);
      reach.lastApplyTs = now;
      if (!(dtMs > 0)) dtMs = 1000 / 60;
      else if (dtMs > 1000 / 15) dtMs = 1000 / 15;   // clamp a long gap so we scale, not leap
      var dtScale = (dtMs / 1000) * 60;               // 1.0 at 60fps; >1 compensates a low frame rate

      // Depth smoothing: a One Euro filter on the size signal. The goal here is
      // jitter (not lag), so the speed-adaptive filter is the right tool — it
      // smooths hard while depth is held steady (killing resting jitter) and
      // opens up during an active push (so no lag is re-added). It's framerate-
      // independent (tracks its own dt). Raw reach.hand.size still drives the
      // clutch re-anchor (ADR 0011); we reset the filter on acquire / re-anchor
      // so its next output snaps to the raw size → ds≈0, no z jerk.
      if (reach.sizeRender === null || reach.snapSizeOnNext) {
        _reachEuroSize.reset();
        reach.snapSizeOnNext = false;
      }
      reach.sizeRender = _reachEuroSize.filter(reach.hand.size, now);

      var ox = hr.x - reach.calib.x;
      var oy = hr.y - reach.calib.y;
      var r  = Math.sqrt(ox * ox + oy * oy);

      if (reach.reticleEl) {
        // Reticle travel: REACH_RETICLE_GAIN px of cursor movement per unit of
        // hand offset, clamped to ±42% of the short edge so a high gain still
        // can't fling the cursor off-screen.
        var reticleSpan = Math.min(W, H);
        var reticleMax  = reticleSpan * 0.42;
        var dxPx = (ox / 0.4) * reticleSpan * REACH_RETICLE_GAIN;
        var dyPx = (oy / 0.4) * reticleSpan * REACH_RETICLE_GAIN;
        dxPx = Math.max(-reticleMax, Math.min(reticleMax, dxPx));
        dyPx = Math.max(-reticleMax, Math.min(reticleMax, dyPx));
        reach.reticleEl.style.transform = 'translate(' + dxPx + 'px,' + dyPx + 'px)';
        if (r > REACH_REST_ZONE) reach.reticleEl.classList.add('is-pushing');
        else reach.reticleEl.classList.remove('is-pushing');
        if (reach.clutched) reach.reticleEl.classList.add('is-clutched');
        else reach.reticleEl.classList.remove('is-clutched');
        // Morph the cursor to match the visitor's current gesture: fist while
        // clutched, open palm otherwise. Calibration / loss branches above
        // clear both classes.
        reach.reticleEl.classList.toggle('is-fist',  reach.clutched);
        reach.reticleEl.classList.toggle('is-palm', !reach.clutched);
      }

      if (r > REACH_REST_ZONE) {
        var scale = (r - REACH_REST_ZONE) / r;
        // Pan: mirror the existing drag sign — hand right ⇒ camera looks
        // right. dtScale keeps the pan RATE framerate-independent, matching
        // the depth push below — this was the one Reach input still riding
        // the frame rate, so an inference-induced FPS dip silently slowed
        // the pan under the visitor's hand.
        var panDt = MOTION_DT_COMP ? dtScale : 1;
        camTarget.x += -ox * scale * REACH_PAN * panDt;
        camTarget.y +=  oy * scale * REACH_PAN * panDt;
      }

      // Depth: bigger hand ⇒ closer to camera ⇒ fly forward (z decreases).
      // Depth is pinned (skip the contribution) when:
      //   - clutched: the visitor has committed a depth, or
      //   - recalibSizeOnNext: a re-anchor is pending (clutch release or Focus
      //     exit) — hold z for the frame or two until calib.size catches up.
      // Pan keeps writing in all of these; any prior zVel coasts on FLY_FRICTION.
      if (!reach.clutched && !reach.recalibSizeOnNext) {
        var ds = reach.sizeRender - reach.calib.size;
        if (Math.abs(ds) > 0.008) {
          camTarget.z -= ds * REACH_FLY * dtScale;
        }
      }
    }

    function reachShowHint() {
      if (reach.hintShown || !reach.hintEl) return;
      reach.hintShown = true;
      reach.hintEl.classList.add('is-visible');
    }
    function reachClearHint() {
      if (!reach.hintShown || !reach.hintEl) return;
      reach.hintShown = false;
      reach.hintEl.classList.remove('is-visible');
    }

    // One-time guide cue: fades in on enable, then fades itself out after a
    // few seconds. Self-arming timer so it never lingers across a teardown.
    function reachShowOnboard() {
      if (!reach.onboardEl) return;
      if (reach.onboardTimer) { clearTimeout(reach.onboardTimer); reach.onboardTimer = null; }
      reach.onboardEl.classList.add('is-visible');
      reach.onboardTimer = setTimeout(reachClearOnboard, REACH_ONBOARD_MS);
    }
    function reachClearOnboard() {
      if (reach.onboardTimer) { clearTimeout(reach.onboardTimer); reach.onboardTimer = null; }
      if (reach.onboardEl) reach.onboardEl.classList.remove('is-visible');
    }

    // First-run acquisition cue: "Identifying powers", shown once per visitor
    // while we hunt for the hand. Gated on a localStorage flag so it greets a
    // newcomer but never nags a returning one. It clears the instant a hand is
    // calibrated, and a safety timeout keeps it from lingering if none appears.
    function reachIdentifySeen() {
      try { return localStorage.getItem('reachIdentifySeen') === '1'; }
      catch (e) { return false; }
    }
    function reachShowIdentify() {
      if (!reach.identifyEl || reachIdentifySeen()) return;
      try { localStorage.setItem('reachIdentifySeen', '1'); } catch (e) {}
      if (reach.identifyTimer) { clearTimeout(reach.identifyTimer); reach.identifyTimer = null; }
      reach.identifyEl.classList.add('is-visible');
      reach.identifyTimer = setTimeout(reachClearIdentify, REACH_ONBOARD_MS * 2);
    }
    function reachClearIdentify() {
      if (reach.identifyTimer) { clearTimeout(reach.identifyTimer); reach.identifyTimer = null; }
      if (reach.identifyEl) reach.identifyEl.classList.remove('is-visible');
    }

    // Esc and tab-hide also disable The Reach (Esc additionally releases Focus
    // via the existing keydown listener above — both run, which is fine).
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && reach.enabled) disableReach();
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && reach.enabled) disableReach();
    });

    reachInitDom();

    /* ══════════════════════════════════════════
       INPUT — TOUCH
    ══════════════════════════════════════════ */
    if (!IS_MOBILE) {
      /* Desktop touchscreens: keep the original two-finger depth gesture,
         byte-for-byte the same as before this mobile pass. */
      var touchY0 = 0;
      window.addEventListener('touchstart', function (e) {
        if (e.touches.length === 2) touchY0 = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      }, { passive: true });

      window.addEventListener('touchmove', function (e) {
        // Two-finger vertical drag = depth scroll
        if (e.touches.length === 2 && introDone && !focused) {
          hideUiForever();
          var yNow = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          camTarget.z -= (touchY0 - yNow) * 0.12;
          touchY0 = yNow;
        }
      }, { passive: true });
    } else {
      /* ── Mobile gesture model (unified — replaces pointer + two-finger) ──
         · one finger: horizontal drag = look/pan X, vertical drag = fly
           forward/back through the void (with release momentum)
         · two fingers: vertical average = fly (same depth channel)
         · tap (< TAP_THRESHOLD px, quick): focus / release a frame        */
      var tStartX = 0, tStartY = 0, tStartT = 0;
      var tLastX  = 0, tLastY  = 0;
      var tMoved  = 0;
      var tPinch  = false;        // gesture began / became multi-touch
      var tPinchY0 = 0;
      var lastVZ  = 0;            // last-frame vertical delta → momentum seed

      canvas.addEventListener('touchstart', function (e) {
        if (!introDone) return;
        zVel = 0;                 // a new touch cancels fly momentum
        if (e.touches.length >= 2) {
          tPinch  = true;
          tPinchY0 = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          return;
        }
        var t = e.touches[0];
        tStartX = tLastX = t.clientX;
        tStartY = tLastY = t.clientY;
        tStartT = performance.now();
        tMoved  = 0;
        lastVZ  = 0;
        tPinch  = false;
        document.body.classList.add('is-dragging');
      }, { passive: true });

      canvas.addEventListener('touchmove', function (e) {
        if (!introDone) return;
        // Block pull-to-refresh / page scroll while exploring the canvas.
        if (e.cancelable) e.preventDefault();
        hideUiForever();

        if (e.touches.length >= 2) {
          // Two-finger vertical average drives depth.
          tPinch = true;
          var yAvg = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          if (!focused) {
            // Swipe up (yAvg decreasing) → fly forward (z decreases).
            var dz2 = (yAvg - tPinchY0) * TOUCH_PINCH;  // up → dz2<0 → forward
            camTarget.z += dz2;
            lastVZ = dz2;
          }
          tPinchY0 = yAvg;
          return;
        }
        if (tPinch) return;       // ignore the leftover finger after a pinch

        var t  = e.touches[0];
        var dx = t.clientX - tLastX;
        var dy = t.clientY - tLastY;
        tLastX = t.clientX;
        tLastY = t.clientY;
        // Track furthest displacement from the start so a tap stays a tap.
        var disp = Math.max(Math.abs(t.clientX - tStartX), Math.abs(t.clientY - tStartY));
        if (disp > tMoved) tMoved = disp;

        if (focused) return;      // while focused, a tap releases — no fly/pan

        // Horizontal = look/pan X (matches desktop drag sign).
        camTarget.x += -dx * TOUCH_PAN_X;
        // Vertical = fly: swipe up (dy<0) → forward (z decreases), down → back.
        var dz = dy * TOUCH_FLY;   // dy<0 → dz<0 → camTarget.z decreases → forward
        camTarget.z += dz;
        lastVZ = dz;               // remember this frame's z-delta for momentum
      }, { passive: false });

      function endTouch(e) {
        if (!introDone) return;
        document.body.classList.remove('is-dragging');

        // Still fingers down (e.g. lifted one of two)? keep gesture alive.
        if (e.touches && e.touches.length > 0) return;

        var dt   = performance.now() - tStartT;
        var moved = tMoved;
        var wasPinch = tPinch;
        tPinch = false;

        // Tap → focus / release a frame.
        if (!wasPinch && moved < TAP_THRESHOLD && dt < 450) {
          var hit = raycastFrames(tStartX, tStartY);
          if (focused) {
            if (hit && hit !== focused) setFocus(hit);
            else releaseFocus();
          } else if (hit) {
            setFocus(hit);
          }
          zVel = 0;
          return;
        }

        // Otherwise: hand vertical velocity to fly momentum.
        if (!focused) zVel = lastVZ;
      }
      canvas.addEventListener('touchend', endTouch, { passive: true });
      canvas.addEventListener('touchcancel', function (e) {
        document.body.classList.remove('is-dragging');
        tPinch = false;
        if (!e.touches || e.touches.length === 0) zVel = 0;
      }, { passive: true });
    }

    /* ══════════════════════════════════════════
       RESIZE
    ══════════════════════════════════════════ */
    window.addEventListener('resize', function () {
      W = window.innerWidth;
      H = window.innerHeight;
      renderer.setSize(W, H);
      camera.aspect = W / H;
      camera.updateProjectionMatrix();
    });

    /* ══════════════════════════════════════════
       INFINITE WRAP — keep every frame within half a
       cell of the camera on all three axes
    ══════════════════════════════════════════ */
    function wrap(value, center, size) {
      var d = value - center;
      d = ((d % size) + size * 1.5) % size - size * 0.5;
      return center + d;
    }

    /* ══════════════════════════════════════════
       RENDER LOOP
    ══════════════════════════════════════════ */
    function render() {
      requestAnimationFrame(render);
      var time = clock.getElapsedTime();

      /* MOTION_DT_COMP — real frame dt expressed in 60fps-frames (dtN = 1 at
         exactly 60fps, ~0.42 at 144Hz, ~2 at 30fps; clamped to ≤4 so a stall
         resumes gently rather than leaping). Each per-frame constant is then
         corrected once per frame: eases via 1-(1-k)^dtN, frictions via f^dtN,
         integrations via ×dtN. All are identities at dtN = 1, so the flag
         set false (dtN pinned to 1) restores the old behavior exactly. */
      var frameNow = performance.now();
      var frameDt  = lastFrameTs ? (frameNow - lastFrameTs) : (1000 / 60);
      lastFrameTs  = frameNow;
      if (!(frameDt > 0)) frameDt = 1000 / 60;
      else if (frameDt > 1000 / 15) frameDt = 1000 / 15;
      // Hitch filter (DT_SMOOTH_EASE): ease toward the measured dt so a lone
      // long frame steps motion gently while sustained rates stay correct.
      dtSmoothMs += (frameDt - dtSmoothMs) * DT_SMOOTH_EASE;
      var dtN    = MOTION_DT_COMP ? dtSmoothMs * 0.06 : 1;   // 16.667ms → 1
      var kCam   = 1 - Math.pow(1 - LERP_CAM,   dtN);
      var kSway  = 1 - Math.pow(1 - SWAY_EASE,  dtN);
      var kFocus = 1 - Math.pow(1 - FOCUS_EASE, dtN);
      var kRgb   = 1 - Math.pow(1 - RGB_EASE,   dtN);
      var kOp    = 1 - Math.pow(1 - DIM_EASE,   dtN);

      // Drag inertia after release — friction decays per unit time, the
      // integration scales by dtN, so a fling glides the same distance over
      // the same duration at any frame rate.
      if (!isDragging && !focused) {
        var fPan = Math.pow(PAN_FRICTION, dtN);
        panVX *= fPan;
        panVY *= fPan;
        if (Math.abs(panVX) > 0.0005) camTarget.x += panVX * dtN;
        if (Math.abs(panVY) > 0.0005) camTarget.y += panVY * dtN;
      }

      // Mobile vertical-swipe fly momentum (zVel is a per-60fps-frame z-delta)
      if (Math.abs(zVel) > 0.0008) {
        if (!focused) camTarget.z += zVel * dtN;
        zVel *= Math.pow(FLY_FRICTION, dtN);
      } else {
        zVel = 0;
      }

      // The Reach contributes its per-frame deltas to camTarget here, so it
      // inherits the chase, inertia, focus tween, and idle sway for free.
      reachApplyToTarget();

      // Camera chase (kCam = LERP_CAM corrected for the real frame dt, so the
      // chase converges at the same rate per second at any frame rate)
      cam.x += (camTarget.x - cam.x) * kCam;
      cam.y += (camTarget.y - cam.y) * kCam;
      cam.z += (camTarget.z - cam.z) * kCam;
      camera.position.set(cam.x, cam.y, cam.z);

      /* Shutter drag (Phase 3) — derive per-frame camera velocity from
         the chase above. Every input (scroll, drag, intro, The Reach,
         Focus glide) writes through this single channel, so they all
         inherit smear for free (PRD stories 26, 27, 28). Clamp per axis
         so a backgrounded-tab resume or teleport can't streak absurdly
         on the first frame back (PRD story 29; same spirit as the reel's
         Math.min(dt, 50) clamp at line ~777). The shared Vector3 is
         mutated in place — every frame material sees the new value
         next render via the shared uniform reference. */
      if (SHUTTER_DRAG_ENABLED) {
        // Normalise the per-frame delta to a per-60fps-frame velocity (÷dtN)
        // so streak strength reflects camera SPEED, not refresh rate — the
        // designed 60fps look holds on 144Hz monitors and through FPS dips.
        var dvx = (cam.x - camPrev.x) / dtN;
        var dvy = (cam.y - camPrev.y) / dtN;
        var dvz = (cam.z - camPrev.z) / dtN;
        if (dvx >  SHUTTER_CLAMP_XY) dvx =  SHUTTER_CLAMP_XY;
        else if (dvx < -SHUTTER_CLAMP_XY) dvx = -SHUTTER_CLAMP_XY;
        if (dvy >  SHUTTER_CLAMP_XY) dvy =  SHUTTER_CLAMP_XY;
        else if (dvy < -SHUTTER_CLAMP_XY) dvy = -SHUTTER_CLAMP_XY;
        if (dvz >  SHUTTER_CLAMP_Z)  dvz =  SHUTTER_CLAMP_Z;
        else if (dvz < -SHUTTER_CLAMP_Z)  dvz = -SHUTTER_CLAMP_Z;
        sharedCamVel.set(
          dvx * SHUTTER_GAIN_XY,
          dvy * SHUTTER_GAIN_XY,
          dvz * SHUTTER_GAIN_Z
        );
        camPrev.x = cam.x;
        camPrev.y = cam.y;
        camPrev.z = cam.z;
      }

      // Idle mouse sway (eased, reduced while focused)
      var swayMul = focused ? 0.25 : 1;
      camera.rotation.y += ((-mouseNX * SWAY_X * swayMul) - camera.rotation.y) * kSway;
      camera.rotation.x += ((-mouseNY * SWAY_Y * swayMul) - camera.rotation.x) * kSway;

      // Focus tween progress
      focusT += (focusGoal - focusT) * kFocus;
      if (focused && focusGoal === 0 && focusT < 0.01) {
        // Fully released — restore
        focused.renderOrder = 0;
        focused.material.depthTest = true;
        focused = null;
        focusT  = 0;
      }
      var fe = focusT < 0.5
        ? 4 * focusT * focusT * focusT
        : 1 - Math.pow(-2 * focusT + 2, 3) / 2;     // cubic in-out

      // RGB split strength — fast drags and fast scroll-throughs split the channels
      var zSpeed    = Math.abs(camTarget.z - cam.z);
      var dragSpeed = Math.sqrt(panVX * panVX + panVY * panVY);
      var rgbTarget = Math.min(0.028, zSpeed * 0.0007 + dragSpeed * 0.020);
      rgbShift += (rgbTarget - rgbShift) * kRgb;

      // Frame updates
      for (var i = 0; i < meshes.length; i++) {
        var m = meshes[i];
        var L = m.userData.layout;

        if (m === focused) {
          // Glide to a point straight ahead of the camera
          var tx = cam.x;
          var ty = cam.y;
          var tz = cam.z - FOCUS_DIST;
          m.position.x = focusFrom.x + (tx - focusFrom.x) * fe;
          m.position.y = focusFrom.y + (ty - focusFrom.y) * fe;
          m.position.z = focusFrom.z + (tz - focusFrom.z) * fe;
          m.rotation.y = focusFrom.ry * (1 - fe);
          m.rotation.z = focusFrom.rz * (1 - fe);
          var s = 1 + (focusFit - 1) * fe;
          m.scale.set(s, s, 1);
          m.material.uniforms.uOpacity.value = 1;
          m.material.uniforms.uShift.value   = 0;   // focused frame stays clean
          // Lift shade to full brightness while focused
          m.material.uniforms.uShade.value = L.shade + (1 - L.shade) * fe;
          continue;
        }

        // Float bob + infinite wrap around the camera
        var fy = L.y + Math.sin(time * L.floatSpeed + L.floatPhase) * FLOAT_AMP;
        m.position.x = wrap(L.x, cam.x, CELL_X);
        m.position.y = wrap(fy,  cam.y, CELL_Y);
        m.position.z = wrap(L.z, cam.z - CELL_Z * 0.28, CELL_Z); // bias field ahead of camera
        m.rotation.y = L.rotY;
        m.rotation.z = L.rotZ;
        m.scale.set(1, 1, 1);
        m.material.uniforms.uShade.value = L.shade;

        // RGB split scales with proximity — frames flying past split hardest
        var dz   = Math.abs(m.position.z - cam.z);
        var prox = 1 - Math.min(1, dz / 120);
        m.material.uniforms.uShift.value = rgbShift * (0.25 + 0.75 * prox);

        // Dim everything else while a frame is focused
        var targetOp = focused ? DIM_OPACITY : 1;
        var u = m.material.uniforms.uOpacity;
        u.value += (targetOp - u.value) * kOp;
      }

      renderer.render(scene, camera);
    }

    /* ══════════════════════════════════════════
       BOOT
    ══════════════════════════════════════════ */
    render();

  })();
  </script>
</body>
</html>
