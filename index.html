<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KabTakAayush — Visual Storyteller</title>
  <meta name="description" content="Aayush — photography &amp; film. Step inside the void: frames worth keeping." />

  <!-- The theme, resolved BEFORE the stylesheet paints. Deliberately inline
       and duplicated into every page: an external script cannot be guaranteed
       to run before first paint, and no-FOUC is a hard constraint. Only the
       pre-paint stamp lives here — all behaviour after first paint is theme.js.
       A localStorage throw (private mode) degrades to the OS preference. -->
  <script>
  (function(){var t;try{t=localStorage.getItem('kta-theme')}catch(_){}
  if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#faf7ef" media="(prefers-color-scheme: light)" />

  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ─── Void-page overrides ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
    }

    body { cursor: grab; }
    body.is-dragging { cursor: grabbing; }
    body.is-hovering { cursor: pointer; }
    body.is-focused  { cursor: zoom-out; }

    /* Three.js canvas sits behind everything */
    #void-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: block;
      /* Stop browser scroll / pull-to-refresh stealing canvas gestures on touch */
      touch-action: none;
    }

    /* Nav floats above the canvas and is ALWAYS VISIBLE, on every device.

       The desktop "peek when the pointer nears the top edge" behaviour is
       retired: it hid the site's only navigation behind a gesture nobody
       intended, made the header react to ordinary pointer movement, and left
       the homepage as the one page where the theme toggle was undiscoverable.
       Mobile never had it (no hover), so this also makes the two behave
       identically for the first time.

       In its place, a soft short scrim: the site nav's own gradient at a
       higher top-stop alpha and no blur. It is what keeps the nav's type
       readable when a bright frame drifts directly behind it — .65 is not a
       taste value, it is the alpha at which dark-theme nav type clears 4.5:1
       over a blown-out white frame (tools/contrast-check.ps1). */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 25;
      background: linear-gradient(
        to bottom,
        rgba(var(--bg-rgb), 0.65) 0%,
        rgba(var(--bg-rgb), 0.34) 60%,
        rgba(var(--bg-rgb), 0) 100%
      );
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .nav img, .nav a {
      -webkit-user-drag: none;
      user-select: none;
    }

    /* ─── Film grain overlay ─── */
    #void-grain {
      position: fixed;
      inset: -120px;
      z-index: 15;
      pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      background-size: 240px 240px;
      opacity: 0.14;
      animation: grain-jump 0.85s steps(2) infinite;
    }
    @keyframes grain-jump {
      0%   { transform: translate(0, 0); }
      20%  { transform: translate(-46px, 32px); }
      40%  { transform: translate(28px, -54px); }
      60%  { transform: translate(-32px, -18px); }
      80%  { transform: translate(50px, 24px); }
      100% { transform: translate(-12px, 46px); }
    }

    /* ─── Center overlay: big logo + CTAs ─── */
    #void-center {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    /* Hidden forever once the user starts exploring */
    #void-center.is-hidden { opacity: 0; }
    #void-center.is-hidden .void-ctas { pointer-events: none !important; }

    #void-center .center-logo {
      width: clamp(200px, 30vw, 420px);
      height: auto;
      transform: scale(4.0);
      transition: transform 3.1s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
      filter: drop-shadow(0 10px 50px rgba(0, 0, 0, 0.7));
      user-select: none;
    }
    #void-center.is-settled .center-logo { transform: scale(1); }

    .void-ctas {
      display: flex;
      gap: 14px;
      pointer-events: all;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.9s ease 0.25s, transform 0.9s ease 0.25s;
    }
    #void-center.is-settled .void-ctas {
      opacity: 1;
      transform: translateY(0);
    }

    /* Hint — lower-right */
    .void-hint {
      position: fixed;
      bottom: clamp(20px, 3vh, 36px);
      right: clamp(24px, 3vw, 52px);
      z-index: 20;
      font-family: var(--text, 'Helvetica Neue', sans-serif);
      font-size: 9px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold, #e3b23c);
      opacity: 0;
      transition: opacity 0.7s ease;
    }
    .void-hint.is-visible { opacity: 0.45; }

    /* ─── Loader ─── */
    #void-loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg-deep);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      transition: opacity 0.9s ease-out;
    }
    #void-loader.is-fading { opacity: 0; pointer-events: none; }

    .vl-logo {
      font-family: var(--head, 'Helvetica Neue', sans-serif);
      font-size: 11px;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--gold, #e3b23c);
    }

    .vl-track {
      width: 180px;
      height: 1px;
      background: rgba(var(--ink-rgb), 0.08);
      position: relative;
      overflow: hidden;
    }
    .vl-fill {
      position: absolute;
      inset: 0;
      background: var(--gold, #e3b23c);
      transform-origin: left center;
      transform: scaleX(0);
      transition: transform 0.12s linear;
    }

    .vl-count {
      font-family: var(--text, 'Helvetica Neue', sans-serif);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: rgba(var(--ink-rgb), 0.2);
    }

    /* ─── Mobile / narrow-viewport layout (desktop untouched) ─── */
    @media (max-width: 767px), (pointer: coarse) {
      /* Mobile keeps its existing always-visible behaviour and inherits the
         same scrim as desktop — the two are finally the same nav. */
      .nav {
        padding-top: env(safe-area-inset-top);
      }

      /* Hint clears the safe area and sits centered-ish at the bottom */
      .void-hint {
        bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(14px, 2.5vh, 24px));
        right: 50%;
        transform: translateX(50%);
        font-size: 8px;
        letter-spacing: 0.28em;
        text-align: center;
        white-space: nowrap;
      }

      /* Loader respects the safe area */
      #void-loader {
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
                 env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .vl-track { width: min(180px, 60vw); }

      /* Center logo a touch smaller so it never overflows narrow screens */
      #void-center .center-logo {
        width: clamp(150px, 56vw, 320px);
      }

      /* Stack the two CTAs into full-width-ish, ≥44px tap targets */
      .void-ctas {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        width: min(320px, 84vw);
      }
      .void-ctas .btn {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        white-space: nowrap;
      }
    }

    /* ─── Reduced motion: calm the film grain ─── */
    @media (prefers-reduced-motion: reduce) {
      #void-grain { animation: none; }
    }

    /* ─── The Reach (opt-in hand steering) ─── */
    /* The CTA is visually distinct from the rest of the site chrome — a gold
       pill with an inline palm glyph and a slow, soft outer pulse — because
       it opts the visitor into something genuinely unusual (camera access,
       hand-steering) and that deserves a button that looks unusual. */
    .reach-cta {
      position: fixed;
      bottom: clamp(20px, 3vh, 36px);
      left: clamp(24px, 3vw, 52px);
      z-index: 20;
      font-family: var(--text, 'Helvetica Neue', sans-serif);
      font-size: 10px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--gold, #e3b23c);
      background: rgba(var(--accent-rgb), 0.04);
      border: 1px solid rgba(var(--accent-rgb), 0.55);
      border-radius: 99px;
      padding: 9px 18px 9px 13px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s ease, color 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    .reach-cta__icon { width: 16px; height: 16px; display: block; color: currentColor; }
    .reach-cta__label { display: inline-block; }
    .reach-cta.is-visible { opacity: 0.95; pointer-events: auto; }
    /* Idle pulse — only while the CTA is visible and the Reach is neither on
       nor failed. Soft outer gold glow that breathes once every 2.4s. */
    @keyframes reach-cta-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0); }
      50%      { box-shadow: 0 0 0 5px rgba(var(--accent-rgb), 0.16); }
    }
    .reach-cta.is-visible:not(.is-on):not(.is-failed) {
      animation: reach-cta-pulse 2.4s ease-in-out infinite;
    }
    .reach-cta:hover {
      color: var(--fill-ink);
      background: var(--gold, #e3b23c);
      border-color: var(--gold, #e3b23c);
    }
    .reach-cta.is-on {
      color: var(--fill-ink);
      background: var(--gold, #e3b23c);
      border-color: var(--gold, #e3b23c);
    }
    .reach-cta.is-failed {
      color: rgba(255, 120, 120, 0.85);
      border-color: rgba(255, 120, 120, 0.55);
      background: transparent;
    }

    .reach-indicator {
      position: fixed;
      top: clamp(14px, 2.4vh, 28px);
      right: clamp(14px, 2.4vw, 28px);
      z-index: 22;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      font-family: var(--text, 'Helvetica Neue', sans-serif);
      font-size: 9px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.78);
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 80, 80, 0.5);
      border-radius: 99px;
      pointer-events: none;
    }
    .reach-indicator.is-on { display: inline-flex; }
    .reach-indicator::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ff3838;
      box-shadow: 0 0 6px rgba(255, 56, 56, 0.7);
      animation: reach-blink 1.4s ease-in-out infinite;
    }
    @keyframes reach-blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.35; }
    }

    /* The reticle is the on-canvas joystick knob. It has two visual modes:
       - calibrating: the 22px gold circle below (no gesture class set)
       - gesturing:   the matching palm/fist SVG (via .is-palm/.is-fist)
       The clutch ring (::after) composes on top of either mode. */
    .reach-reticle {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 18;
      width: 22px;
      height: 22px;
      margin-left: -11px;
      margin-top: -11px;
      border-radius: 50%;
      border: 1px solid rgba(var(--accent-rgb), 0.7);
      background: rgba(var(--accent-rgb), 0.06);
      color: var(--gold, #e3b23c);
      pointer-events: none;
      display: none;
      transform: translate(0, 0);
      /* The reticle's transform is rewritten every rendered frame while The
         Reach is on — promote it to its own compositor layer so each move is
         composite-only, never a repaint over the canvas. */
      will-change: transform;
      transition: background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .reach-reticle.is-on { display: block; }
    .reach-reticle.is-pushing {
      background: rgba(var(--accent-rgb), 0.22);
      border-color: var(--gold, #e3b23c);
      box-shadow: 0 0 18px rgba(var(--accent-rgb), 0.35);
    }
    /* Gesture mode: the hand SVG IS the cursor — fade out the circle so the
       silhouette reads cleanly. The pushing glow still composes via box-shadow. */
    .reach-reticle.is-palm,
    .reach-reticle.is-fist {
      border-color: transparent;
      background: transparent;
    }
    .reach-reticle__hand {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 32px;
      height: 32px;
      margin-left: -16px;
      margin-top: -16px;
      color: var(--gold, #e3b23c);
      opacity: 0;
      transform: scale(0.85);
      transform-origin: center;
      transition: opacity 150ms ease, transform 150ms ease;
      pointer-events: none;
    }
    .reach-reticle.is-palm .reach-reticle__hand[data-gesture="palm"],
    .reach-reticle.is-fist .reach-reticle__hand[data-gesture="fist"] {
      opacity: 0.95;
      transform: scale(1);
    }
    /* The clutch ring — a thin concentric outer ring around the reticle that
       appears only while depth-clutched. ~1.4× the reticle's radius
       (reticle r ≈ 11px ⇒ ring r ≈ 15.4px), in the existing reticle gold,
       with a 120ms opacity fade. The ring rides the reticle's transform so
       the centre (whether dot or fist glyph) keeps tracking pan offset while
       the ring is held. */
    .reach-reticle::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 38px;
      height: 38px;
      margin-left: -19px;
      margin-top: -19px;
      border-radius: 50%;
      border: 1.5px solid var(--gold, #e3b23c);
      pointer-events: none;
      opacity: 0;
      transition: opacity 120ms ease;
    }
    .reach-reticle.is-clutched::after { opacity: 0.85; }

    .reach-hint {
      position: fixed;
      bottom: clamp(64px, 8vh, 96px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-family: var(--text, 'Helvetica Neue', sans-serif);
      font-size: 9px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold, #e3b23c);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      white-space: nowrap;
    }
    .reach-hint.is-visible { opacity: 0.55; }

    /* The Reach guide — replaces the void-hint while The Reach is on. Three
       illustrated gestures stacked over their names, occupying the same
       lower-right slot the scroll/drag/click line used to. */
    .reach-guide {
      position: fixed;
      bottom: clamp(20px, 3vh, 36px);
      right: clamp(24px, 3vw, 52px);
      z-index: 20;
      display: flex;
      gap: clamp(14px, 2vw, 22px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.7s ease;
      color: var(--gold, #e3b23c);
    }
    .reach-guide.is-visible { opacity: 0.7; }
    .reach-guide__item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .reach-guide__icon {
      width: 22px;
      height: 22px;
      color: currentColor;
    }
    .reach-guide__label {
      font-family: var(--text, 'Helvetica Neue', sans-serif);
      font-size: 9px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }

    /* Transient onboarding cue — shown once when The Reach turns on, then
       fades on its own after a few seconds. Three short lines, centred. */
    .reach-onboard {
      position: fixed;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 21;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      text-align: center;
      opacity: 0;
      transition: opacity 0.8s ease;
      color: var(--gold, #e3b23c);
    }
    .reach-onboard.is-visible { opacity: 0.85; }
    .reach-onboard__line {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--text, 'Helvetica Neue', sans-serif);
      font-size: clamp(10px, 1.4vw, 13px);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .reach-onboard__icon {
      width: clamp(18px, 2vw, 22px);
      height: clamp(18px, 2vw, 22px);
      flex: none;
      color: currentColor;
    }
    .reach-onboard__line b {
      font-weight: 600;
      color: #f0e2b0;
    }

    /* First-run acquisition cue — "Identifying powers" — shown once, while we
       are still searching for the hand. Hidden the moment a hand is locked in
       (calibrated), at which point the gesture onboard takes over. */
    .reach-identify {
      position: fixed;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 21;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
      color: var(--gold, #e3b23c);
      font-family: var(--text, 'Helvetica Neue', sans-serif);
      font-size: clamp(11px, 1.5vw, 14px);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .reach-identify.is-visible { opacity: 0.9; }
    .reach-identify__dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: currentColor;
      flex: none;
      animation: reach-identify-pulse 1.1s ease-in-out infinite;
    }
    @keyframes reach-identify-pulse {
      0%, 100% { opacity: 0.25; transform: scale(0.7); }
      50%      { opacity: 1;    transform: scale(1.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .reach-identify__dot { animation: none; opacity: 0.85; }
    }

    @media (max-width: 767px), (pointer: coarse) {
      .reach-cta {
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(46px, 7vh, 70px));
        font-size: 9px;
        letter-spacing: 0.28em;
        padding: 10px 16px;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
      }
      /* Once The Reach is on, the centred "Release · Esc" pill would sit on top
         of the bottom-right gesture guide. On phones, shift it down into the
         bottom-left corner so the two never overlap. (Desktop keeps it where
         the idle CTA was.) */
      .reach-cta.is-on {
        left: clamp(16px, 4vw, 24px);
        transform: none;
        bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(16px, 3vh, 28px));
      }
      .reach-hint { bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(96px, 14vh, 130px)); }
    }

    /* Reduced-motion: The Reach is explicitly motion-first and is not
       offered to a visitor who has opted out of motion. */
    @media (prefers-reduced-motion: reduce) {
      .reach-cta { display: none !important; }
    }

    /* ─── The light Void ───────────────────────────────────────────────
       Everything above themes for free through the semantic tokens. These
       three do not, because each was tuned against near-black specifically
       and needs a different *kind* of value on paper, not a different
       shade of the same one. */

    /* The centre logo's shadow. A dark drop-shadow on paper does not read as
       lift — it reads as a hole punched in the page. Light gets a soft warm
       shadow at a fraction of the opacity so the mark sits ON the paper.

       OPEN: whether logo.png itself holds against paper is a live check the
       owner has to make on a real display. The gold letters carry dark
       outlines and should hold; if they don't, the fallback is a
       light-variant asset, not a heavier shadow. */
    html[data-theme="light"] #void-center .center-logo {
      filter: drop-shadow(0 8px 30px rgba(90, 70, 30, 0.18));
    }

    /* The Void's own grain. 0.14 of a saturate(0) noise reads as texture over
       near-black; over paper the same layer must not LIGHTEN a ground already
       near the top of the range, so it is multiplied — it darkens into the
       paper, mirroring the way dark's grain lightens out of the black. The
       blend direction is settled; only the amount below is a taste dial.

       TRYING (2026-07-22, owner asked for grain "like dark mode"): 0.30, up
       from 0.055. Measured against the real feTurbulence texture, grain
       amplitude is linear in opacity, and the old value was carrying roughly a
       sixth of dark's:

         dark  0.14 normal   on #080808 → SD 3.19, ground 8   → 20.5
         light 0.055 multiply on #f4f0e6 → SD 0.55, ground 244 → 242.2
         light 0.30  multiply on #f4f0e6 → SD 3.01, ground 244 → 234.2

       0.30 puts light within 6% of dark's measured grain. The cost is the
       ground: multiply can only darken, so the paper sits ~10 levels lower
       (#f4f0e6 → ~#eae7dd). Dark's grain shifts its ground just as far in the
       other direction (+12.5), so the two stay symmetric — but "textured
       paper" vs "dirty paper" is an EYEBALL CALL that no measurement settles.

       TO REVERT: set opacity back to 0.055 and delete this note. To soften
       without reverting: 0.24 → SD 2.4, 0.20 → SD 2.0, 0.14 → SD 1.4.
       Not width-scoped, so this is every view. */
    html[data-theme="light"] #void-grain {
      opacity: 0.30;
      mix-blend-mode: multiply;
    }

    /* The centre CTAs. A `.btn` carries no fill at rest — it is a label and a
       hairline, which works everywhere else on the site because it sits on a
       flat themed ground. The Void is not flat: the buttons float over a live
       field of photographs. In dark the fog crushes that field to near-black
       and the cream label wins every time. In light the fog only reaches paper,
       but the frames themselves stay mid-to-dark, so a near-black label on
       transparent disappears the moment a frame drifts behind it.

       So light gets the plate dark never needed: paper at 0.72, which holds
       8.59:1 for the label against the worst case (a black frame directly
       behind) while still letting the space read through the chip. No
       backdrop-filter — a blur over a canvas that repaints every frame is
       exactly the cost this page has spent two rounds removing.

       `isolation` is load-bearing, not decoration. The gold hover sweep is a
       `::before` at `z-index: -1`, and an element with no stacking context of
       its own paints such a child BELOW its own background — the plate would
       swallow the sweep. Isolating makes the button its own context, where a
       negative-z child paints after the background and before the label:
       plate, then sweep, then text. */
    html[data-theme="light"] .void-ctas .btn {
      background: rgba(var(--bg-rgb), 0.72);
      border-color: rgba(var(--ink-rgb), 0.20);
      isolation: isolate;
    }

    /* And the hover sweep goes to light's OWN gold. `--accent-fill` is the
       shared bright brand gold that deliberately survives into light with
       `--fill-ink` on top, which is why these two arrived carrying the dark
       theme's yellow. Owner's call (2026-07-22): on paper these should sweep
       the darker gold-ink instead, so the Void's hover matches the ochre the
       rest of light mode reads in.

       The label has to move with the fill — it is not a separate preference.
       `--fill-ink` near-black on `--accent` ochre is 3.21:1 and fails; the
       ground colour on top is 5.76:1 and passes. So light inverts dark's
       arrangement rather than copying it: dark is a bright fill with a dark
       label, light is a dark fill with a paper label. Both keep the sweep
       reading as one solid gold block with legible type on it.

       Scoped to the Void's pair on the owner's instruction — `.btn` and
       `.back-btn` elsewhere still sweep `--accent-fill` in light. If those
       ever get the same treatment it belongs in styles.css, not here. */
    html[data-theme="light"] .void-ctas .btn::before {
      background: var(--accent);
    }
    html[data-theme="light"] .void-ctas .btn:hover {
      color: var(--bg);
      border-color: var(--accent);
    }

    /* The camera-active indicator is NOT themed, and that is deliberate.
       Its job is privacy honesty in the absence of a self-view, so it must
       never be the thing that fades. It stays a dark plate with white type
       and a red dot in both themes; light only makes the plate more opaque,
       because a 0.4 black over paper composites to a mid grey that white
       type cannot sit on. */
    html[data-theme="light"] .reach-indicator {
      background: rgba(0, 0, 0, 0.66);
    }
  </style>

  <!-- The theme — drives the Void's scene clear colour and fog alongside the
       page's own ground. Loaded before three.js so KTA.theme is queryable the
       moment the scene is constructed. The IIFE below subscribes via
       KTA.theme.subscribe — see theme.js for the hard rules. -->
  <script src="theme.js"></script>

  <!-- Three.js r128 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
  (function () {
    'use strict';

    /* ══════════════════════════════════════════
       MOBILE DETECTION — decided once at load.
       Desktop path stays byte-for-byte identical when false.
    ══════════════════════════════════════════ */
    var IS_MOBILE = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches)
                    || window.innerWidth < 768;

    /* Phase 3 — Shutter drag is COMPILED OUT when reduced-motion is set
       OR on mobile (frame-budget guard — matches the antialias-off posture
       below). Detected once at load so the #define is stable for the life
       of the page; the page already reloads on most preference changes. */
    var PREFERS_REDUCED_MOTION = !!(window.matchMedia
      && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    var SHUTTER_DRAG_ENABLED = !PREFERS_REDUCED_MOTION && !IS_MOBILE;
    var MAX_TEX   = 1024;             // mobile: downscale textures to this long edge
    var MOBILE_SLOTS      = 60;       // mobile: frames drawn in the field
    var MOBILE_TEX_BUDGET = 30;       // mobile: distinct reel images loaded (frames reuse these)

    /* ══════════════════════════════════════════
       CONFIG
    ══════════════════════════════════════════ */
    var REEL_COUNT   = /* @REEL-COUNT */ 99;            // images in assets/reel/ — the Admin rewrites this number (keep the marker). See ADR 0004.
    var SLOTS        = 101;           // floating frames in the field (textures repeat) — bump for a denser void
    var CELL_X       = 120;           // wrap cell width  (world units)
    var CELL_Y       = 64;            // wrap cell height
    var CELL_Z       = 460;           // wrap cell depth — full scroll loop length
    var IMG_BASE_H   = 6.4;           // base frame height (world units)
    var CAM_FOV      = 55;
    /* The Void's space, per theme. Dark is the original near-black; light is
       --bg-deep, a step below page paper so the space still reads as
       *behind* the page rather than level with it.

       Fog density is a per-theme pair too: the same falloff that reads as
       distance against near-black reads flatter against a bright ground,
       because there is less luminance range left between a far frame and
       the space it fades into. The light value is nudged up to buy that
       separation back. Whether it actually reads as depth on a real display
       is an eyeball item — flagged for the owner's on-device pass. */
    var BG_COLOR_DARK  = 0x080808;
    var BG_COLOR_LIGHT = 0xf4f0e6;
    var FOG_DENSITY_DARK  = 0.0105;   // depth falloff into black
    var FOG_DENSITY_LIGHT = 0.0126;

    function isLightTheme() {
      return document.documentElement.getAttribute('data-theme') === 'light';
    }

    var BG_COLOR    = isLightTheme() ? BG_COLOR_LIGHT : BG_COLOR_DARK;
    var FOG_DENSITY = isLightTheme() ? FOG_DENSITY_LIGHT : FOG_DENSITY_DARK;

    /* The light-trail gate (see the fragment shader below): 1 in dark, 0 in
       light. Shared by every frame material the same way sharedCamVel is —
       one uniform OBJECT held by reference, so flipping the theme is a single
       assignment rather than a walk over every mesh.

       Declared HERE, above the scene's KTA.theme.subscribe, because subscribe
       fires its listener immediately on registration and that listener writes
       to this object. Declared after it, `var` hoisting would leave it
       undefined at exactly that moment. */
    var sharedTrail = { value: isLightTheme() ? 0 : 1 };

    /* Shutter drag (Phase 3) — `Math.min(dt, 50)` precedent at line ~777
       inspires the velocity clamp below. SHUTTER_GAIN_XY/Z translate world
       camera delta to UV-space smear. SHUTTER_CLAMP_* bound the per-frame
       velocity so a backgrounded tab returning after 10s can't streak
       absurdly on the first frame back (PRD story 29). Numbers eyeballed
       — the starting curve is conservative: visible only on hard flicks
       and the intro pull-back, invisible at rest. */
    var SHUTTER_GAIN_XY  = 0.040;     // world-X/Y delta → UV smear (longer streak; was 0.018 → 0.028)
    var SHUTTER_GAIN_Z   = 0.0060;    // world-Z delta → radial UV smear (was 0.0028 → 0.0042; intro pull-back drags harder)
    var SHUTTER_CLAMP_XY = 2.4;       // max per-frame world XY delta consumed
    var SHUTTER_CLAMP_Z  = 9.0;       // max per-frame world Z delta consumed

    var PAN_SPEED    = 0.030;         // world units per dragged px
    var PAN_FRICTION = 0.93;          // drag inertia decay
    var SCROLL_SPEED = 0.050;         // depth per wheel deltaY unit

    // Mobile touch tuning
    var TOUCH_PAN_X   = 0.045;        // world units per horizontal dragged px (look)
    var TOUCH_FLY     = 0.060;        // depth per vertical dragged px (fly)
    var TOUCH_PINCH   = 0.090;        // depth per two-finger vertical px
    var FLY_FRICTION  = 0.92;         // vertical-swipe momentum decay
    var TAP_THRESHOLD = 8;            // px of movement that still counts as a tap
    var LERP_CAM     = 0.075;         // camera chase smoothing
    var SWAY_X       = 0.045;         // idle mouse sway (radians)
    var SWAY_Y       = 0.030;
    var SWAY_EASE    = 0.05;          // idle sway chase (per 60fps-frame)
    var RGB_EASE     = 0.10;          // RGB-split strength chase (per 60fps-frame)
    var DIM_EASE     = 0.08;          // frame dim/undim chase (per 60fps-frame)

    /* Framerate-independent motion. Every ease/friction above is tuned per
       FRAME at 60fps, but rAF runs at whatever the device gives: a 144Hz
       monitor ran the whole Void ~2.4× stiffer/faster than designed, and any
       FPS dip (The Reach's inference sharing the main thread, weak phones)
       made the chase and inertia visibly sluggish — the motion itself
       absorbed the jank. When true, the render loop measures real dt and
       compensates every ease (k → 1-(1-k)^dtN), friction (f → f^dtN) and
       integration (×dtN) — mathematically identical at exactly 60fps, same
       feel at any refresh rate. Set false to pin dtN to 1 and restore the
       previous fixed-per-frame behavior exactly. */
    var MOTION_DT_COMP = true;
    /* Hitch filter for MOTION_DT_COMP: the dt estimate is EASED toward the
       measured frame time instead of consumed raw. An isolated long frame
       (texture upload, GC, shader compile) would otherwise advance every
       ease by up to 4 frames' worth in a single step — a visible jump at
       exactly the moments the page is busiest. Eased, a lone hitch nudges
       motion only slightly and the chase glides back gracefully, while a
       SUSTAINED rate change (a 30fps phone, a 144Hz monitor) converges to
       the true dt within ~25 frames and stays framerate-correct. */
    var DT_SMOOTH_EASE = 0.12;
    /* Pre-upload every frame texture to the GPU while the loader still
       covers the screen (time-sliced so the loader never freezes). Without
       it, three.js uploads each texture + its mipmaps on the first frame
       that frame becomes visible — recurring mid-intro hitches as the
       pull-back sweeps new frames into view. PREUPLOAD_MAX_MS bounds the
       whole pass: a slow GPU must never pin the visitor at a finished
       loader, so leftovers just lazy-upload as before (now softened by the
       DT_SMOOTH_EASE hitch filter). Set false to restore lazy uploads. */
    var PREUPLOAD_TEX    = true;
    var PREUPLOAD_MAX_MS = 2000;

    var FLOAT_AMP    = 0.22;          // frame bob amplitude

    var FOCUS_DIST   = 14;            // focused frame distance from camera
    var FOCUS_FILL   = 0.62;          // fraction of viewport the frame fills
    var FOCUS_EASE   = 0.085;         // focus tween smoothing
    var DIM_OPACITY  = 0.12;          // other frames while focused

    var INTRO_DUR    = 3000;          // ms — camera pull-back
    var INTRO_FROM   = -34;           // camera start (deep inside the field)
    var INTRO_TO     = 26;            // camera settle position

    // The Reach — opt-in hand-steering tunables (see ADR 0010)
    var REACH_PAN          = 0.55;
    var REACH_FLY          = 28.0;
    var REACH_REST_ZONE    = 0.07;
    var REACH_RETICLE_GAIN = 0.34;      // on-screen reticle travel per unit hand offset (was 0.18)
    var REACH_DETECTION_HZ = 30;        // how often we look for the hand + read its gesture. Higher =
                                        // the tracker re-reads pose/clutch sooner, so detection feels
                                        // more responsive, at the cost of main-thread time the 3D
                                        // render would otherwise use (a small smoothness trade).
    var REACH_SMOOTH       = 0.35;
    // One Euro Filter (Casiez, Roussel & Vogel, CHI 2012) — adaptive smoothing
    // for the render-rate cursor/void glide, replacing the old fixed lerp. It
    // smooths hard when the hand is slow (kills resting jitter) and opens up
    // when it moves fast (kills lag on a flick) — something no single lerp
    // factor can do at once. Detection is untouched; this only shapes the x/y
    // glide, so the clutch/depth path (which reads raw reach.hand) is unaffected.
    //   MIN_CUTOFF: baseline cutoff (Hz). Lower = steadier at rest but laggier;
    //               higher = snappier but lets more jitter through.
    //   BETA:       speed coupling. Higher = cutoff opens sooner as the hand
    //               speeds up, so fast moves shed lag; too high lets jitter back
    //               in mid-move.
    //   DCUTOFF:    cutoff for the internal speed estimate; 1.0 is standard.
    var REACH_EURO_MIN_CUTOFF = 0.8;    // ↓ from 1.0: steadier at rest (more jitter removed)
    var REACH_EURO_BETA       = 2.0;    // ↑ from 1.5: opens the cutoff sooner so fast moves keep
                                        //   their snap despite the lower baseline — net smoother
    var REACH_EURO_DCUTOFF    = 1.0;
    // Depth (push/pull) smoothing — a One Euro filter on the size signal (see
    // makeOneEuro). This was a plain dt-glide when the goal was purely lag /
    // framerate-independence; now that the goal is LESS JITTER, the speed-
    // adaptive filter earns its keep: heavy smoothing while depth is held steady
    // (kills resting jitter), opening up during an active push (so no lag is
    // re-added). Size's velocity scale is ~10x smaller than a hand sweep, so
    // BETA is far larger than the x/y filter's to open the cutoff on a push.
    //   MIN_CUTOFF: baseline cutoff (Hz). Lower = steadier / less jitter at rest.
    //   BETA:       speed coupling. Higher = snappier push, but lets jitter back.
    var REACH_EURO_SIZE_MIN_CUTOFF = 0.6;
    var REACH_EURO_SIZE_BETA       = 15.0;
    var REACH_EURO_SIZE_DCUTOFF    = 1.0;
    // Robust size metric: average the four wrist→knuckle spans instead of the
    // single middle-finger one, to cut depth jitter AT THE SOURCE (cleaner input
    // beats more output smoothing — no lag cost). Set false to restore the exact
    // prior single-span behavior, byte-for-byte (the one-flag revert).
    var REACH_ROBUST_SIZE = true;
    var REACH_LOSS_HINT_MS = 2000;
    var REACH_CURL_OPEN_RATIO = 0.85;   // curl > this * calib.curl ⇒ clutched→open
    var REACH_CURL_FIST_RATIO = 0.55;   // curl < this * calib.curl ⇒ open→clutched
    var REACH_CLUTCH_DWELL_MS = 120;    // intention-dwell on clutch transitions
    var REACH_ONBOARD_MS      = 6000;   // how long the one-time guide cue lingers before fading
    // Frame-aligned detection: run inference the moment the camera presents a
    // fresh frame (requestVideoFrameCallback) instead of on a free-running
    // timer. The timer sampled frames up to a full detection interval stale
    // and drifted against the camera's cadence — aliasing hiccups, plus the
    // occasional duplicate-frame inference (pure waste). Still budgeted to
    // REACH_DETECTION_HZ, so inference cost is unchanged; the win is lower
    // hand→screen latency (~half a detection interval on average) and
    // steadier sample spacing. Falls back to the setTimeout loop where rVFC
    // is unsupported. Set false to restore the plain timer loop exactly.
    var REACH_USE_RVFC        = true;
    var REACH_RVFC_BACKSTOP_MS = 300;   // frame callbacks silent this long ⇒ timer backstop drives detection
    var REACH_DETECT_STALE_MS = 350;    // no inference for this long (camera stalled) ⇒ treat hand as lost
    // Prewarm on CTA hover (desktop only): the wasm + model CDN fetch is the
    // slow part of enabling (seconds, once per session). Kicking it off on
    // first hover means the click usually lands on a warm cache and The Reach
    // starts near-instantly. Phones have no hover and shouldn't spend data on
    // a maybe. Set false to load strictly on click, as before.
    var REACH_PREWARM         = true;

    // Mobile: a lighter field of evenly-spread frames.
    if (IS_MOBILE) SLOTS = MOBILE_SLOTS;
    if (IS_MOBILE) REACH_DETECTION_HZ = 24;   // throttle hand inference on phones, but keep it lively

    // Touch devices get touch-appropriate hint wording.
    if (IS_MOBILE) {
      var hintInit = document.getElementById('void-hint');
      if (hintInit) hintInit.textContent = 'Drag · swipe · tap a frame';
    }

    /* ══════════════════════════════════════════
       SEEDED PSEUDO-RANDOM (LCG) — deterministic layout
    ══════════════════════════════════════════ */
    function makeRng(seed) {
      var s = (seed >>> 0) || 1;
      return function () {
        s = (Math.imul(1664525, s) + 1013904223) >>> 0;
        return s / 0xffffffff;
      };
    }

    /* ══════════════════════════════════════════
       FIELD LAYOUT — scattered slots inside one wrap cell
    ══════════════════════════════════════════ */
    // Mobile: a fixed, evenly-spread sample of reel indices.
    // Frame count and texture count are decoupled — frames reuse this sample.
    var mobileTexSample = null;
    if (IS_MOBILE) {
      mobileTexSample = new Array(MOBILE_TEX_BUDGET);
      for (var s = 0; s < MOBILE_TEX_BUDGET; s++) {
        mobileTexSample[s] = Math.floor(s * REEL_COUNT / MOBILE_TEX_BUDGET) % REEL_COUNT;
      }
    }

    var layouts = [];
    (function buildLayouts() {
      // R2 low-discrepancy sequence → evenly spread, organic-looking scatter
      // (plain seeded random produced diagonal streaks and clusters)
      var G1 = 0.7548776662466927;
      var G2 = 0.5698402909980532;

      for (var i = 0; i < SLOTS; i++) {
        var r = makeRng(i * 1013 + 71);
        r(); r(); r();                       // warm up — decorrelates nearby seeds

        var fx = (0.5 + i * G1) % 1;
        var fy = (0.5 + i * G2) % 1;
        var x  = (fx - 0.5) * CELL_X + (r() - 0.5) * 9;
        var y  = (fy - 0.5) * CELL_Y + (r() - 0.5) * 7;
        // Stratified depth — one frame per Z band, no empty gaps between layers
        var z  = -((i + 0.5) / SLOTS) * CELL_Z + (r() - 0.5) * (CELL_Z / SLOTS) * 0.9;

        // Keep dead-center clear so the logo reads during the intro
        if (Math.abs(x) < 8 && Math.abs(y) < 5) {
          x += (x < 0 ? -1 : 1) * 11;
        }

        layouts.push({
          x: x, y: y, z: z,
          rotY:       0,                    // flat collage — frames face the camera
          rotZ:       0,
          scale:      0.50 + r() * 1.30,    // 0.50 → 1.80 (strong size contrast)
          shade:      0.45 + r() * 0.55,    // brightness variety 0.45 → 1.0
          floatPhase: r() * Math.PI * 2,
          floatSpeed: 0.22 + r() * 0.38,
          // Desktop: cycle the reel. Mobile: pull from a fixed-size sample so
          // a denser field reuses a flat texture budget instead of loading more.
          tex: IS_MOBILE
                 ? mobileTexSample[i % MOBILE_TEX_BUDGET]
                 : i % REEL_COUNT
        });
      }
    })();

    /* ══════════════════════════════════════════
       THREE.JS SETUP
    ══════════════════════════════════════════ */
    var canvas = document.getElementById('void-canvas');
    var W = window.innerWidth;
    var H = window.innerHeight;

    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: !IS_MOBILE, powerPreference: 'high-performance' });
    // Cap pixel ratio harder on mobile to spare the GPU.
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_MOBILE ? 1.5 : 2));
    renderer.setSize(W, H);
    renderer.outputEncoding = THREE.sRGBEncoding;

    var scene = new THREE.Scene();
    scene.background = new THREE.Color(BG_COLOR);
    scene.fog = new THREE.FogExp2(BG_COLOR, FOG_DENSITY);

    /* The Void's NEGATIVE SPACE follows the theme. This was The Hour's
       subscribe block, and it is a one-line swap rather than a rewrite
       because KTA.theme deliberately mirrors the KTA.hourTint API shape —
       fires immediately on registration, returns an unsubscribe, and never
       breaks the page over a throwing listener.

       The frame ShaderMaterial (below) is INTENTIONALLY UNTOUCHED: the work
       is what's inside the frames, only the room moves. That was The Hour's
       boundary and it is the theme's boundary unchanged.

       The swap lands in the same task as the page's own attribute change, so
       the canvas and the chrome are one event; the bulb's overlay covers the
       seam on the way through. */
    if (window.KTA && window.KTA.theme) {
      window.KTA.theme.subscribe(function (t) {
        var light = t.theme === 'light';
        var space = light ? BG_COLOR_LIGHT : BG_COLOR_DARK;
        scene.background.setHex(space);
        if (scene.fog) {
          scene.fog.color.setHex(space);
          scene.fog.density = light ? FOG_DENSITY_LIGHT : FOG_DENSITY_DARK;
        }
        // Light-trails off on paper; the motion smear itself is untouched
        // and runs in both themes.
        sharedTrail.value = light ? 0 : 1;
      });
    }

    var camera = new THREE.PerspectiveCamera(CAM_FOV, W / H, 0.1, 4000);
    camera.rotation.order = 'YXZ';

    var raycaster = new THREE.Raycaster();
    var pointerNDC = new THREE.Vector2();

    /* ══════════════════════════════════════════
       TEXTURE LOADING — reel images

       Desktop loads the whole reel (unchanged). Mobile loads only the
       distinct reel images its lighter field actually references, and
       downscales each to MAX_TEX on the long edge to cut GPU memory.
    ══════════════════════════════════════════ */
    var loadedN  = 0;
    var loader   = new THREE.TextureLoader();
    var fillEl   = document.getElementById('vl-fill');
    var countEl  = document.getElementById('vl-count');
    var reelTex  = new Array(REEL_COUNT).fill(null);

    // Which reel indices does the field actually need?
    var needed = [];
    (function collectNeeded() {
      var seen = {};
      for (var i = 0; i < layouts.length; i++) {
        var t = layouts[i].tex;
        if (!seen[t]) { seen[t] = true; needed.push(t); }
      }
      // Desktop: keep the original behaviour of loading the full reel in order.
      if (!IS_MOBILE) {
        needed = [];
        for (var k = 0; k < REEL_COUNT; k++) needed.push(k);
      }
    })();

    var TO_LOAD = needed.length;
    countEl.textContent = '0 / ' + TO_LOAD;   // reflect the real total up front

    function pad2(n) { return n < 10 ? '0' + n : '' + n; }

    // Mobile: shrink an oversized image onto an offscreen canvas so the
    // GPU never holds the full-resolution bitmap.
    function downscaleImage(img) {
      var w = img.naturalWidth || img.width;
      var h = img.naturalHeight || img.height;
      var long = Math.max(w, h);
      if (!IS_MOBILE || long <= MAX_TEX) return img;
      var s = MAX_TEX / long;
      var cw = Math.max(1, Math.round(w * s));
      var ch = Math.max(1, Math.round(h * s));
      var cnv = document.createElement('canvas');
      cnv.width = cw;
      cnv.height = ch;
      var ctx = cnv.getContext('2d');
      ctx.drawImage(img, 0, 0, cw, ch);
      return cnv;
    }

    function prepTex(tex) {
      // Swap in a downscaled bitmap on mobile before the texture uploads.
      if (IS_MOBILE && tex.image) {
        var small = downscaleImage(tex.image);
        if (small !== tex.image) {
          tex.image = small;
          tex.needsUpdate = true;
        }
      }
      tex.encoding  = THREE.sRGBEncoding;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.generateMipmaps = true;
      try { tex.anisotropy = renderer.capabilities.getMaxAnisotropy(); } catch (e) {}
      return tex;
    }

    /* Push every loaded texture to the GPU before the scene ever draws it.
       Runs between "all images loaded" and buildScene, chunked across rAF
       frames so the loader UI stays live — the whole cost lands behind the
       loader overlay instead of as hitches spread through the intro
       pull-back (three.js otherwise uploads a texture + generates its
       mipmaps on the first frame its mesh enters the frustum). Falls back
       to the lazy status quo if initTexture is unavailable. */
    function preuploadTextures(done) {
      if (!PREUPLOAD_TEX || !renderer.initTexture) { done(); return; }
      var queue = [];
      for (var i = 0; i < reelTex.length; i++) if (reelTex[i]) queue.push(reelTex[i]);
      var t0 = performance.now();
      (function step() {
        var frameStart = performance.now();
        if (frameStart - t0 > PREUPLOAD_MAX_MS) { done(); return; }   // budget spent — rest goes lazy
        // ~12ms of uploads per frame: a fast GPU clears several textures a
        // frame and finishes in a few hundred ms; a slow one does fewer per
        // frame and is cut off by the budget above.
        while (queue.length && (performance.now() - frameStart) < 12) {
          try { renderer.initTexture(queue.pop()); } catch (e) {}
        }
        if (queue.length) requestAnimationFrame(step);
        else done();
      })();
    }

    function tick() {
      loadedN++;
      fillEl.style.transform = 'scaleX(' + (loadedN / TO_LOAD) + ')';
      countEl.textContent    = loadedN + ' / ' + TO_LOAD;
      if (loadedN >= TO_LOAD) preuploadTextures(buildScene);
    }

    for (var j = 0; j < needed.length; j++) {
      (function (idx) {
        loader.load('assets/reel/' + pad2(idx + 1) + '.webp', function (tex) {
          reelTex[idx] = prepTex(tex);
          tick();
        }, undefined, tick); // count errors too so loader never stalls
      })(needed[j]);
    }

    /* ══════════════════════════════════════════
       FRAME MATERIAL — textured plane with RGB-split
       (chromatic aberration) driven by movement speed.
       Frames only; the rest of the page is untouched.
    ══════════════════════════════════════════ */
    /* Shutter drag (Phase 3) — when KTA_SHUTTER_DRAG is defined, the
       vertex shader computes per-frame a UV-space smear vector from the
       shared camera-velocity uniform `uCamVelW`. Closer frames smear MORE
       than far ones (parallax depth — PRD story 24) by dividing by camera
       depth. Z velocity contributes a radial outward component from the
       frame's screen position so the intro pull-back rakes outward
       (PRD story 26). When the define is OFF the existing shader path is
       byte-identical — no extra tap, no extra varying, no cost. */
    var FRAME_VERT = [
      'uniform vec3 uCamVelW;',
      'varying vec2 vUv;',
      '#ifdef KTA_SHUTTER_DRAG',
      'varying vec2 vSmear;',
      '#endif',
      '#include <fog_pars_vertex>',
      'void main() {',
      '  vUv = uv;',
      '  vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);',
      '  vec4 clipPos    = projectionMatrix * mvPosition;',
      '  gl_Position     = clipPos;',
      '  #ifdef KTA_SHUTTER_DRAG',
      // Camera-space depth (positive in front of camera). Closer → smaller
      // → bigger smear via 1/depthN. Clamped so a frame right next to the
      // lens doesn't explode the smear (and tab-resume defence).
      '    float depthN  = clamp(-mvPosition.z / 40.0, 0.5, 6.0);',
      // World XY velocity → UV smear (scaled by depth for parallax).
      '    vec2 smearXY  = uCamVelW.xy / depthN;',
      // Z velocity → radial outward smear from screen center. Use NDC of
      // this vertex; small epsilon avoids div-by-zero at exact center.
      '    vec2 ndc      = clipPos.xy / max(clipPos.w, 0.001);',
      '    float r       = length(ndc) + 1e-4;',
      '    vec2 radial   = ndc / r;',
      '    vec2 smearZ   = radial * (uCamVelW.z / depthN);',
      '    vSmear        = smearXY + smearZ;',
      '  #endif',
      '  #include <fog_vertex>',
      '}'
    ].join('\n');

    var FRAME_FRAG = [
      'uniform sampler2D map;',
      'uniform float uShift;',
      'uniform float uShade;',
      'uniform float uOpacity;',
      'varying vec2 vUv;',
      '#ifdef KTA_SHUTTER_DRAG',
      'varying vec2 vSmear;',
      // Light-trail gate, 1 in dark / 0 in light. A uniform rather than a
      // #define or a second shader: the theme changes at RUNTIME, and a
      // define would mean recompiling every frame material mid-session.
      'uniform float uTrail;',
      '#endif',
      '#include <fog_pars_fragment>',
      'void main() {',
      '  vec2 off = vec2(uShift, uShift * -0.6);',
      '  #ifdef KTA_SHUTTER_DRAG',
      // 7 taps along vSmear: the center keeps the chromatic-aberration
      // split (so the existing "fast move = colour split" feel is
      // preserved); the six off-center taps are plain RGB. At rest
      // vSmear ≈ 0 so all seven taps sample the same texel → no visible
      // blur AND the GPU can cache → self-limiting cost (PRD).
      '    vec3 c0  = vec3(',
      '      texture2D(map, vUv + off).r,',
      '      texture2D(map, vUv).g,',
      '      texture2D(map, vUv - off).b',
      '    );',
      '    vec3 cm1 = texture2D(map, vUv - vSmear * 0.25).rgb;',
      '    vec3 cp1 = texture2D(map, vUv + vSmear * 0.25).rgb;',
      '    vec3 cm2 = texture2D(map, vUv - vSmear * 0.50).rgb;',
      '    vec3 cp2 = texture2D(map, vUv + vSmear * 0.50).rgb;',
      '    vec3 cm3 = texture2D(map, vUv - vSmear * 0.75).rgb;',
      '    vec3 cp3 = texture2D(map, vUv + vSmear * 0.75).rgb;',
      // Weights: center 1.0, then 0.8/0.6/0.4 outward → normalised /4.6.
      '    vec3 col = (c0 + (cm1 + cp1) * 0.8 + (cm2 + cp2) * 0.6 + (cm3 + cp3) * 0.4) / 4.6;',
      // Light-trail term (see docs/adr/0014). Averaging dilutes highlights,
      // so a moving lamp / sun-glint would never streak. Take the LIGHTEN
      // (max) across the same taps — bounded by the brightest SOURCE texel,
      // so a trail can never exceed white (self-limiting; no EffectComposer
      // pass, respecting the de-jank history). Gate to true highlights via
      // luma so midtones stay pure motion blur. At rest all taps coincide,
      // so bright == col and the mix is a no-op → motion-gated for free.
      '    vec3 bright = max(c0, max(max(cm1, cp1), max(cm2, max(cp2, max(cm3, cp3)))));',
      '    float blum = dot(bright, vec3(0.299, 0.587, 0.114));',
      // uTrail is 0 in the light theme, which collapses the mix below to a
      // no-op and leaves pure motion blur. A lighten-only trail cannot read
      // against a bright ground — it would only wash the frames out — so the
      // trail is dark-theme-only while the SMEAR itself runs in both.
      // See ADR 0014 and CONTEXT.md ("shutter drag").
      '    float g = smoothstep(0.6, 1.0, blum) * 0.7 * uTrail;',  // 0.6 = highlight floor, 0.7 = trail strength
      '    col = mix(col, max(col, bright), g);',
      '  #else',
      '    vec3 col = vec3(',
      '      texture2D(map, vUv + off).r,',
      '      texture2D(map, vUv).g,',
      '      texture2D(map, vUv - off).b',
      '    );',
      '  #endif',
      '  gl_FragColor = vec4(col * uShade, uOpacity);',
      '  #include <fog_fragment>',
      '}'
    ].join('\n');

    /* Shutter drag (Phase 3) — ONE Vector3 shared across every frame's
       material. The render loop mutates this object each frame; every
       material reads the updated value automatically because they all
       hold the same reference. O(1) update, never O(meshes). */
    var sharedCamVel = new THREE.Vector3(0, 0, 0);
    var SHUTTER_DEFINES = SHUTTER_DRAG_ENABLED ? { KTA_SHUTTER_DRAG: '' } : {};

    function makeFrameMaterial(tex, shade) {
      var uniforms = THREE.UniformsUtils.merge([
        THREE.UniformsLib.fog,
        {
          map:      { value: null },
          uShift:   { value: 0 },
          uShade:   { value: 1 },
          uOpacity: { value: 1 },
          uCamVelW: { value: null }   // shared Vector3 assigned post-merge
        }
      ]);
      uniforms.map.value      = tex;   // set after merge (merge would clone the texture)
      uniforms.uShade.value   = shade;
      uniforms.uCamVelW.value = sharedCamVel; // shared reference — one set, all see it
      uniforms.uTrail         = sharedTrail;  // shared uniform OBJECT, same reason

      return new THREE.ShaderMaterial({
        defines:        SHUTTER_DEFINES,
        uniforms:       uniforms,
        vertexShader:   FRAME_VERT,
        fragmentShader: FRAME_FRAG,
        fog:            true,
        transparent:    true,
        side:           THREE.FrontSide
      });
    }

    /* ══════════════════════════════════════════
       SCENE BUILD
    ══════════════════════════════════════════ */
    var meshes = [];

    function buildScene() {
      // ── Floating frames ──
      for (var i = 0; i < SLOTS; i++) {
        var L   = layouts[i];
        var tex = reelTex[L.tex];
        if (!tex) continue;

        // tex.image may be an <img> (naturalWidth) or, on mobile, a downscaled
        // <canvas> (width/height only) — handle both so aspect is never NaN.
        var iw = tex.image.naturalWidth  || tex.image.width;
        var ih = tex.image.naturalHeight || tex.image.height;
        var aspect = iw / ih;
        var h = IMG_BASE_H * L.scale;
        var w = h * aspect;

        var geo = new THREE.PlaneGeometry(w, h);
        var mat = makeFrameMaterial(tex, L.shade);

        var mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(L.x, L.y, L.z);
        mesh.rotation.y = L.rotY;
        mesh.rotation.z = L.rotZ;
        mesh.userData = { layout: L, baseW: w, baseH: h };
        scene.add(mesh);
        meshes.push(mesh);
      }

      startIntro();
    }

    /* ══════════════════════════════════════════
       STATE
    ══════════════════════════════════════════ */
    var cam       = { x: 0, y: 0, z: 0 };       // actual camera position
    var camTarget = { x: 0, y: 0, z: 0 };       // chased target
    /* Shutter drag (Phase 3) — previous frame's cam, for velocity. The
       intro re-pins cam.z = INTRO_FROM after this; camPrev is re-pinned
       there too so the very first intro frame has zero phantom velocity
       (the streak comes from the chase, not from the initial jump). */
    var camPrev   = { x: 0, y: 0, z: 0 };
    var panVX = 0, panVY = 0;                   // drag inertia
    var zVel  = 0;                              // mobile vertical-swipe fly momentum
    var mouseNX = 0, mouseNY = 0;               // -1..1 idle sway
    var isDragging  = false;
    var dragMoved   = 0;
    var downX = 0, downY = 0, downT = 0;
    var lastPX = 0, lastPY = 0;
    var introDone = false;
    var clock = new THREE.Clock();
    var lastFrameTs = 0;                        // previous rAF timestamp — real dt for MOTION_DT_COMP
    var dtSmoothMs  = 1000 / 60;                // eased dt estimate (DT_SMOOTH_EASE hitch filter)
    var rgbShift = 0;                           // current RGB-split strength
    var navEl = document.querySelector('.nav');

    // Focus state
    var focused   = null;     // mesh
    var focusT    = 0;        // 0 = free, 1 = locked front-and-center
    var focusGoal = 0;        // tween target (0 or 1)
    var focusFrom = { x: 0, y: 0, z: 0, ry: 0, rz: 0 };
    var focusFit  = 1;

    /* ══════════════════════════════════════════
       INTRO — huge logo over the field, camera pulls
       back while the logo settles to its resting size
    ══════════════════════════════════════════ */
    function startIntro() {
      var loaderEl = document.getElementById('void-loader');
      loaderEl.classList.add('is-fading');
      setTimeout(function () { loaderEl.style.display = 'none'; }, 950);

      cam.z = camTarget.z = INTRO_FROM;
      // Re-pin previous-frame cam so the intro's chase starts at zero
      // velocity, not from the implicit 0 → INTRO_FROM jump (Phase 3).
      camPrev.x = cam.x; camPrev.y = cam.y; camPrev.z = cam.z;

      setTimeout(function () {
        // CSS scales the logo 4.0 → 1 on the same curve & duration
        document.getElementById('void-center').classList.add('is-settled');

        var t0 = performance.now();
        function tickIntro(now) {
          var t = Math.min((now - t0) / INTRO_DUR, 1);
          var e = 1 - Math.pow(1 - t, 4);           // quartic ease-out
          camTarget.z = INTRO_FROM + (INTRO_TO - INTRO_FROM) * e;

          if (t < 1) {
            requestAnimationFrame(tickIntro);
          } else {
            introDone = true;
            var hintEl = document.getElementById('void-hint');
            hintEl.classList.add('is-visible');
            setTimeout(function () { hintEl.classList.remove('is-visible'); }, 6000);
            showReachCta();
          }
        }
        requestAnimationFrame(tickIntro);
      }, 450);
    }

    /* ══════════════════════════════════════════
       FOCUS — click a frame, it glides front-and-center
    ══════════════════════════════════════════ */
    function setFocus(mesh) {
      // Instantly restore any previously focused frame
      if (focused && focused !== mesh) {
        focused.renderOrder = 0;
        focused.material.depthTest = true;
        focused.scale.set(1, 1, 1);
      }
      focused   = mesh;
      focusGoal = 1;
      focusT    = 0;

      focusFrom.x  = mesh.position.x;
      focusFrom.y  = mesh.position.y;
      focusFrom.z  = mesh.position.z;
      focusFrom.ry = mesh.rotation.y;
      focusFrom.rz = mesh.rotation.z;

      // Scale so the frame fills FOCUS_FILL of the viewport at FOCUS_DIST
      var visH = 2 * FOCUS_DIST * Math.tan(THREE.Math.degToRad(CAM_FOV) / 2);
      var visW = visH * camera.aspect;
      var fitH = (visH * FOCUS_FILL) / mesh.userData.baseH;
      var fitW = (visW * 0.78) / mesh.userData.baseW;
      focusFit = Math.min(fitH, fitW);

      mesh.renderOrder = 999;
      mesh.material.depthTest = false;

      document.body.classList.add('is-focused');
    }

    function releaseFocus() {
      if (!focused) return;
      focusGoal = 0;
      document.body.classList.remove('is-focused');
    }

    /* Logo + CTAs disappear for good the moment the user starts exploring */
    var uiGone = false;
    function hideUiForever() {
      if (uiGone) return;
      uiGone = true;
      document.getElementById('void-center').classList.add('is-hidden');
    }

    function raycastFrames(clientX, clientY) {
      pointerNDC.x =  (clientX / W) * 2 - 1;
      pointerNDC.y = -(clientY / H) * 2 + 1;
      raycaster.setFromCamera(pointerNDC, camera);
      var hits = raycaster.intersectObjects(meshes);
      return hits.length ? hits[0].object : null;
    }

    /* ══════════════════════════════════════════
       INPUT — WHEEL (depth)  [desktop only]
    ══════════════════════════════════════════ */
    if (!IS_MOBILE) {
      window.addEventListener('wheel', function (e) {
        e.preventDefault();
        if (!introDone) return;
        hideUiForever();
        if (focused) { releaseFocus(); return; }

        var raw = e.deltaY;
        if (e.deltaMode === 1) raw *= 28;
        else if (e.deltaMode === 2) raw *= 500;
        camTarget.z -= raw * SCROLL_SPEED;   // scroll down = deeper into the void
      }, { passive: false });
    }

    /* ══════════════════════════════════════════
       INPUT — POINTER (drag pan + click focus + hover)  [desktop only]
       Touch devices are driven by the dedicated touch block below so the
       two input systems never apply the same finger twice.
    ══════════════════════════════════════════ */
    function endPointer(e) {
      if (!isDragging) return;
      isDragging = false;
      document.body.classList.remove('is-dragging');

      var isClick = dragMoved < 7 && (performance.now() - downT) < 450;
      if (!isClick) return;

      var hit = raycastFrames(e.clientX, e.clientY);
      if (focused) {
        if (hit && hit !== focused) setFocus(hit);  // switch frames
        else releaseFocus();                         // click anywhere = let go
      } else if (hit) {
        setFocus(hit);
      }
    }

    if (!IS_MOBILE) {
      canvas.addEventListener('pointerdown', function (e) {
        if (!introDone) return;
        hideUiForever();
        isDragging = true;
        dragMoved  = 0;
        downX = lastPX = e.clientX;
        downY = lastPY = e.clientY;
        downT = performance.now();
        panVX = panVY = 0;
        document.body.classList.add('is-dragging');
      });

      window.addEventListener('pointermove', function (e) {
        mouseNX = (e.clientX / W) * 2 - 1;
        mouseNY = (e.clientY / H) * 2 - 1;

        if (isDragging) {
          var dx = e.clientX - lastPX;
          var dy = e.clientY - lastPY;
          lastPX = e.clientX;
          lastPY = e.clientY;
          dragMoved += Math.abs(dx) + Math.abs(dy);

          if (!focused) {
            panVX = -dx * PAN_SPEED;
            panVY =  dy * PAN_SPEED;
            camTarget.x += panVX;
            camTarget.y += panVY;
          }
        } else if (introDone) {
          // Hover cursor
          var hit = raycastFrames(e.clientX, e.clientY);
          document.body.classList.toggle('is-hovering', !!hit && !focused);
        }
      });

      window.addEventListener('pointerup', endPointer);
      window.addEventListener('pointercancel', function () {
        isDragging = false;
        document.body.classList.remove('is-dragging');
      });
    }

    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') releaseFocus();
    });

    // Logo / links in the nav must never be draggable
    navEl.addEventListener('dragstart', function (e) { e.preventDefault(); });

    /* ══════════════════════════════════════════
       THE REACH — opt-in hand steering (ADR 0010)

       An additive writer to camTarget. The CTA below is the only enable
       path: no auto-enable, no hotkey, no URL param. Camera and model are
       not touched until the visitor presses it.
    ══════════════════════════════════════════ */
    var REACH_PREFERS_REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

    var reach = {
      enabled:      false,
      starting:    false,
      stream:      null,
      videoEl:     null,
      landmarker:  null,
      loopTimer:   null,
      hand:        null,    // smoothed { x, y, size, curl, curl345 } in normalised frame coords
      handRaw:     null,    // unsmoothed { x, y } palm position — One Euro owns x/y smoothing
      handRender:  null,    // per-frame One-Euro-filtered { x, y } so cursor/void glide smoothly
      sizeRender:  null,    // framerate-independent eased size for the depth push (render-only)
      snapSizeOnNext: false,// on a calib.size re-anchor, snap sizeRender too so ADR 0011 holds
      lastApplyTs: 0,       // perf ts of the last active reachApplyToTarget, for real-dt depth glide
      calib:       null,    // { x, y, size, curl } captured neutral
      calibSamples: null,
      clutched:    false,   // The clutch: fist pins depth (camTarget.z) while pan stays live
      clutchSince: 0,       // ts of first open→clutched candidate frame, for dwell
      openSince:   0,       // ts of first clutched→open candidate frame, for dwell
      recalibSizeOnNext: false,  // on clutched→open OR focus-exit, re-anchor calib.size (see ADR 0011)
      wasFocused:  false,   // tracks focus→unfocus edge so depth re-anchors when Focus releases
      lastSeenAt:  0,
      lastDetectAt: 0,      // when inference last actually ran — staleness guard for the frame-aligned loop
      nextDetectAt: 0,      // frame-aligned detection budget accumulator (REACH_USE_RVFC)
      lastFrameCbAt: 0,     // when a video frame callback last fired — rVFC liveness for the backstop
      ctaEl:       null,
      indicatorEl: null,
      reticleEl:   null,
      hintEl:      null,
      hintShown:   false,
      identifyEl:  null,    // first-run "Identifying powers" acquisition cue
      identifyTimer: null
    };
    var _reachLandmarkerPromise = null;

    // ── One Euro Filter ──────────────────────────────────────────────────
    // Adaptive low-pass (see the REACH_EURO_* constants for tuning): the cutoff
    // rises with the signal's speed, so a still hand is smoothed heavily and a
    // fast hand is barely smoothed. One instance per axis. Both reset on hand
    // loss so a re-acquire snaps to the fresh position instead of gliding in
    // from a stale one. Pure post-processing — it never touches detection.
    function makeOneEuro(minCutoff, beta, dCutoff) {
      var xPrev = 0, dxPrev = 0, tPrev = 0, primed = false;
      function alpha(cutoff, dt) {
        var tau = 1 / (2 * Math.PI * cutoff);
        return 1 / (1 + tau / dt);
      }
      return {
        reset: function () { primed = false; dxPrev = 0; },
        // x is the new sample, tMs a performance.now() timestamp. Returns the
        // filtered value; framerate-independent because dt is measured, not
        // assumed, so the feel holds on a 60Hz or a 144Hz display alike.
        filter: function (x, tMs) {
          if (!primed) { primed = true; xPrev = x; dxPrev = 0; tPrev = tMs; return x; }
          var dt = (tMs - tPrev) / 1000;
          if (!(dt > 0)) dt = 1 / 60;           // guard a zero/negative interval
          else if (dt > 1 / 30) dt = 1 / 30;    // clamp after a stall so we glide, not jump
          tPrev = tMs;
          var dx  = (x - xPrev) / dt;
          var aD  = alpha(dCutoff, dt);
          var edx = aD * dx + (1 - aD) * dxPrev;   // low-passed speed estimate
          dxPrev  = edx;
          var cutoff = minCutoff + beta * Math.abs(edx);
          var aX  = alpha(cutoff, dt);
          var hatx = aX * x + (1 - aX) * xPrev;
          xPrev = hatx;
          return hatx;
