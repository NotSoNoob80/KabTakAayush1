<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KabTakAayush — Visual Storyteller</title>
  <meta name="description" content="Aayush — photography &amp; film. Step inside the void: frames worth keeping." />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ─── Void-page overrides ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #080808;
    }

    body { cursor: grab; }
    body.is-dragging { cursor: grabbing; }
    body.is-hovering { cursor: pointer; }
    body.is-focused  { cursor: zoom-out; }

    /* Three.js canvas sits behind everything */
    #void-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: block;
      /* Stop browser scroll / pull-to-refresh stealing canvas gestures on touch */
      touch-action: none;
    }

    /* Nav floats above canvas — hidden until the pointer nears the top */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 25;
      background: transparent;
      transform: translateY(-110%);
      transition: transform 0.45s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .nav.is-peek { transform: translateY(0); }
    .nav img, .nav a {
      -webkit-user-drag: none;
      user-select: none;
    }

    /* ─── Film grain overlay ─── */
    #void-grain {
      position: fixed;
      inset: -120px;
      z-index: 15;
      pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      background-size: 240px 240px;
      opacity: 0.14;
      animation: grain-jump 0.85s steps(2) infinite;
    }
    @keyframes grain-jump {
      0%   { transform: translate(0, 0); }
      20%  { transform: translate(-46px, 32px); }
      40%  { transform: translate(28px, -54px); }
      60%  { transform: translate(-32px, -18px); }
      80%  { transform: translate(50px, 24px); }
      100% { transform: translate(-12px, 46px); }
    }

    /* ─── Center overlay: big logo + CTAs ─── */
    #void-center {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    /* Hidden forever once the user starts exploring */
    #void-center.is-hidden { opacity: 0; }
    #void-center.is-hidden .void-ctas { pointer-events: none !important; }

    #void-center .center-logo {
      width: clamp(200px, 30vw, 420px);
      height: auto;
      transform: scale(4.0);
      transition: transform 3.1s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
      filter: drop-shadow(0 10px 50px rgba(0, 0, 0, 0.7));
      user-select: none;
    }
    #void-center.is-settled .center-logo { transform: scale(1); }

    .void-ctas {
      display: flex;
      gap: 14px;
      pointer-events: all;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.9s ease 0.25s, transform 0.9s ease 0.25s;
    }
    #void-center.is-settled .void-ctas {
      opacity: 1;
      transform: translateY(0);
    }

    /* Hint — lower-right */
    .void-hint {
      position: fixed;
      bottom: clamp(20px, 3vh, 36px);
      right: clamp(24px, 3vw, 52px);
      z-index: 20;
      font-family: var(--text, 'Helvetica Neue', sans-serif);
      font-size: 9px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold, #c5a44c);
      opacity: 0;
      transition: opacity 0.7s ease;
    }
    .void-hint.is-visible { opacity: 0.45; }

    /* ─── Loader ─── */
    #void-loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #080808;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      transition: opacity 0.9s ease-out;
    }
    #void-loader.is-fading { opacity: 0; pointer-events: none; }

    .vl-logo {
      font-family: var(--head, 'Helvetica Neue', sans-serif);
      font-size: 11px;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--gold, #c5a44c);
    }

    .vl-track {
      width: 180px;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }
    .vl-fill {
      position: absolute;
      inset: 0;
      background: var(--gold, #c5a44c);
      transform-origin: left center;
      transform: scaleX(0);
      transition: transform 0.12s linear;
    }

    .vl-count {
      font-family: var(--text, 'Helvetica Neue', sans-serif);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.2);
    }

    /* ─── Mobile / narrow-viewport layout (desktop untouched) ─── */
    @media (max-width: 767px), (pointer: coarse) {
      /* No hover on touch, so the peek-on-pointer nav would never appear.
         Keep the compact nav (styles.css) always visible instead — it's the
         only route to Projects/About once the center CTAs hide themselves. */
      .nav {
        transform: translateY(0);
        padding-top: env(safe-area-inset-top);
      }

      /* Hint clears the safe area and sits centered-ish at the bottom */
      .void-hint {
        bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(14px, 2.5vh, 24px));
        right: 50%;
        transform: translateX(50%);
        font-size: 8px;
        letter-spacing: 0.28em;
        text-align: center;
        white-space: nowrap;
      }

      /* Loader respects the safe area */
      #void-loader {
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
                 env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .vl-track { width: min(180px, 60vw); }

      /* Center logo a touch smaller so it never overflows narrow screens */
      #void-center .center-logo {
        width: clamp(150px, 56vw, 320px);
      }

      /* Stack the two CTAs into full-width-ish, ≥44px tap targets */
      .void-ctas {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        width: min(320px, 84vw);
      }
      .void-ctas .btn {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        white-space: nowrap;
      }
    }

    /* ─── Reduced motion: calm the film grain ─── */
    @media (prefers-reduced-motion: reduce) {
      #void-grain { animation: none; }
    }

    /* ─── The Reach (opt-in hand steering) ─── */
    /* The CTA is visually distinct from the rest of the site chrome — a gold
       pill with an inline palm glyph and a slow, soft outer pulse — because
       it opts the visitor into something genuinely unusual (camera access,
       hand-steering) and that deserves a button that looks unusual. */
    .reach-cta {
      position: fixed;
      bottom: clamp(20px, 3vh, 36px);
      left: clamp(24px, 3vw, 52px);
      z-index: 20;
      font-family: var(--text, 'Helvetica Neue', sans-serif);
      font-size: 10px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--gold, #c5a44c);
      background: rgba(197, 164, 76, 0.04);
      border: 1px solid rgba(197, 164, 76, 0.55);
      border-radius: 99px;
      padding: 9px 18px 9px 13px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s ease, color 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    .reach-cta__icon { width: 16px; height: 16px; display: block; color: currentColor; }
    .reach-cta__label { display: inline-block; }
    .reach-cta.is-visible { opacity: 0.95; pointer-events: auto; }
    /* Idle pulse — only while the CTA is visible and the Reach is neither on
       nor failed. Soft outer gold glow that breathes once every 2.4s. */
    @keyframes reach-cta-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(197, 164, 76, 0); }
      50%      { box-shadow: 0 0 0 5px rgba(197, 164, 76, 0.16); }
    }
    .reach-cta.is-visible:not(.is-on):not(.is-failed) {
      animation: reach-cta-pulse 2.4s ease-in-out infinite;
    }
    .reach-cta:hover {
      color: #080808;
      background: var(--gold, #c5a44c);
      border-color: var(--gold, #c5a44c);
    }
    .reach-cta.is-on {
      color: #080808;
      background: var(--gold, #c5a44c);
      border-color: var(--gold, #c5a44c);
    }
    .reach-cta.is-failed {
      color: rgba(255, 120, 120, 0.85);
      border-color: rgba(255, 120, 120, 0.55);
      background: transparent;
    }

    .reach-indicator {
      position: fixed;
      top: clamp(14px, 2.4vh, 28px);
      right: clamp(14px, 2.4vw, 28px);
      z-index: 22;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      font-family: var(--text, 'Helvetica Neue', sans-serif);
      font-size: 9px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.78);
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 80, 80, 0.5);
      border-radius: 99px;
      pointer-events: none;
    }
    .reach-indicator.is-on { display: inline-flex; }
    .reach-indicator::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ff3838;
      box-shadow: 0 0 6px rgba(255, 56, 56, 0.7);
      animation: reach-blink 1.4s ease-in-out infinite;
    }
    @keyframes reach-blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.35; }
    }

    /* The reticle is the on-canvas joystick knob. It has two visual modes:
       - calibrating: the 22px gold circle below (no gesture class set)
       - gesturing:   the matching palm/fist SVG (via .is-palm/.is-fist)
       The clutch ring (::after) composes on top of either mode. */
    .reach-reticle {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 18;
      width: 22px;
      height: 22px;
      margin-left: -11px;
      margin-top: -11px;
      border-radius: 50%;
      border: 1px solid rgba(197, 164, 76, 0.7);
      background: rgba(197, 164, 76, 0.06);
      color: var(--gold, #c5a44c);
      pointer-events: none;
      display: none;
      transform: translate(0, 0);
      transition: background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .reach-reticle.is-on { display: block; }
    .reach-reticle.is-pushing {
      background: rgba(197, 164, 76, 0.22);
      border-color: var(--gold, #c5a44c);
      box-shadow: 0 0 18px rgba(197, 164, 76, 0.35);
    }
    /* Gesture mode: the hand SVG IS the cursor — fade out the circle so the
       silhouette reads cleanly. The pushing glow still composes via box-shadow. */
    .reach-reticle.is-palm,
    .reach-reticle.is-fist {
      border-color: transparent;
      background: transparent;
    }
    .reach-reticle__hand {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 32px;
      height: 32px;
      margin-left: -16px;
      margin-top: -16px;
      color: var(--gold, #c5a44c);
      opacity: 0;
      transform: scale(0.85);
      transform-origin: center;
      transition: opacity 150ms ease, transform 150ms ease;
      pointer-events: none;
    }
    .reach-reticle.is-palm .reach-reticle__hand[data-gesture="palm"],
    .reach-reticle.is-fist .reach-reticle__hand[data-gesture="fist"] {
      opacity: 0.95;
      transform: scale(1);
    }
    /* The clutch ring — a thin concentric outer ring around the reticle that
       appears only while depth-clutched. ~1.4× the reticle's radius
       (reticle r ≈ 11px ⇒ ring r ≈ 15.4px), in the existing reticle gold,
       with a 120ms opacity fade. The ring rides the reticle's transform so
       the centre (whether dot or fist glyph) keeps tracking pan offset while
       the ring is held. */
    .reach-reticle::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 38px;
      height: 38px;
      margin-left: -19px;
      margin-top: -19px;
      border-radius: 50%;
      border: 1.5px solid var(--gold, #c5a44c);
      pointer-events: none;
      opacity: 0;
      transition: opacity 120ms ease;
    }
    .reach-reticle.is-clutched::after { opacity: 0.85; }

    .reach-hint {
      position: fixed;
      bottom: clamp(64px, 8vh, 96px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-family: var(--text, 'Helvetica Neue', sans-serif);
      font-size: 9px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold, #c5a44c);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      white-space: nowrap;
    }
    .reach-hint.is-visible { opacity: 0.55; }

    /* The Reach guide — replaces the void-hint while The Reach is on. Three
       illustrated gestures stacked over their names, occupying the same
       lower-right slot the scroll/drag/click line used to. */
    .reach-guide {
      position: fixed;
      bottom: clamp(20px, 3vh, 36px);
      right: clamp(24px, 3vw, 52px);
      z-index: 20;
      display: flex;
      gap: clamp(14px, 2vw, 22px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.7s ease;
      color: var(--gold, #c5a44c);
    }
    .reach-guide.is-visible { opacity: 0.7; }
    .reach-guide__item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .reach-guide__icon {
      width: 22px;
      height: 22px;
      color: currentColor;
    }
    .reach-guide__label {
      font-family: var(--text, 'Helvetica Neue', sans-serif);
      font-size: 9px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }

    /* Transient onboarding cue — shown once when The Reach turns on, then
       fades on its own after a few seconds. Three short lines, centred. */
    .reach-onboard {
      position: fixed;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 21;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      text-align: center;
      opacity: 0;
      transition: opacity 0.8s ease;
      color: var(--gold, #c5a44c);
    }
    .reach-onboard.is-visible { opacity: 0.85; }
    .reach-onboard__line {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--text, 'Helvetica Neue', sans-serif);
      font-size: clamp(10px, 1.4vw, 13px);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .reach-onboard__icon {
      width: clamp(18px, 2vw, 22px);
      height: clamp(18px, 2vw, 22px);
      flex: none;
      color: currentColor;
    }
    .reach-onboard__line b {
      font-weight: 600;
      color: #f0e2b0;
    }

    @media (max-width: 767px), (pointer: coarse) {
      .reach-cta {
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(46px, 7vh, 70px));
        font-size: 9px;
        letter-spacing: 0.28em;
        padding: 10px 16px;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
      }
      /* Once The Reach is on, the centred "Release · Esc" pill would sit on top
         of the bottom-right gesture guide. On phones, shift it down into the
         bottom-left corner so the two never overlap. (Desktop keeps it where
         the idle CTA was.) */
      .reach-cta.is-on {
        left: clamp(16px, 4vw, 24px);
        transform: none;
        bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(16px, 3vh, 28px));
      }
      .reach-hint { bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(96px, 14vh, 130px)); }
    }

    /* Reduced-motion: The Reach is explicitly motion-first and is not
       offered to a visitor who has opted out of motion. */
    @media (prefers-reduced-motion: reduce) {
      .reach-cta { display: none !important; }
    }
  </style>
</head>
<body>

  <!-- Three.js canvas -->
  <canvas id="void-canvas"></canvas>

  <!-- Film grain -->
  <div id="void-grain"></div>

  <!-- ─── Loader ─── -->
  <div id="void-loader">
    <p class="vl-logo">KabTakAayush</p>
    <div class="vl-track">
      <div class="vl-fill" id="vl-fill"></div>
    </div>
    <p class="vl-count" id="vl-count">0 / 59</p>
  </div>

  <!-- ─── Nav ─── -->
  <nav class="nav">
    <a href="index.html" class="nav__mark">
      <img src="assets/images/logo.png" alt="KabTakAayush" class="nav__logo" draggable="false"
           onerror="this.style.display='none';this.nextElementSibling.style.display='inline';" />
      <span class="nav__mark-fallback" style="display:none;">KabTakAayush</span>
    </a>
    <ul class="nav__links">
      <li><a href="index.html" aria-current="page">Home</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>

  <!-- ─── Center logo + CTAs ─── -->
  <div id="void-center">
    <img src="assets/images/logo.png" alt="KabTakAayush" class="center-logo" draggable="false" />
    <div class="void-ctas">
      <a class="btn" href="projects.html">View Projects</a>
      <a class="btn btn--ghost"
         href="https://www.instagram.com/kabtakaayush/"
         target="_blank" rel="noopener noreferrer">See Instagram ↗</a>
    </div>
  </div>

  <!-- ─── Scroll hint ─── -->
  <p class="void-hint" id="void-hint">Scroll · drag · click a frame</p>

  <!-- ─── The Reach (opt-in hand steering) ─── -->
  <!-- Hand-gesture SVG symbol library, reused by the CTA, the guide, and the reticle -->
  <svg width="0" height="0" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <symbol id="reach-icon-palm" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7.5 13.5V6"/>
          <path d="M10.8 13.5V3.5"/>
          <path d="M14 13.5V4"/>
          <path d="M17.2 13.5V6.5"/>
          <path d="M5 13.5L3 10.5"/>
          <path d="M5 13.5Q4.5 21 12 21Q19.5 21 19.5 13.5"/>
        </g>
      </symbol>
      <symbol id="reach-icon-fist" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 11Q7 7 11 7H14Q18 7 18 11V17Q18 21 14 21H11Q7 21 7 17Z"/>
          <path d="M9 10.5H16"/>
          <path d="M9 13.5H16"/>
          <path d="M9 16.5H16"/>
          <path d="M7 14Q4.5 14 4.5 16Q4.5 18 7 17.5"/>
        </g>
      </symbol>
    </defs>
  </svg>

  <button type="button" class="reach-cta" id="reach-cta" aria-pressed="false">
    <svg class="reach-cta__icon" aria-hidden="true"><use href="#reach-icon-palm"/></svg>
    <span class="reach-cta__label">The Reach</span>
  </button>
  <div class="reach-indicator" id="reach-indicator" aria-live="polite">Camera on</div>
  <div class="reach-reticle" id="reach-reticle" aria-hidden="true">
    <svg class="reach-reticle__hand" data-gesture="palm" aria-hidden="true"><use href="#reach-icon-palm"/></svg>
    <svg class="reach-reticle__hand" data-gesture="fist" aria-hidden="true"><use href="#reach-icon-fist"/></svg>
  </div>
  <p class="reach-hint" id="reach-hint">Show your hand</p>
  <div class="reach-guide" id="reach-guide" aria-hidden="true">
    <div class="reach-guide__item">
      <svg class="reach-guide__icon" aria-hidden="true"><use href="#reach-icon-palm"/></svg>
      <span class="reach-guide__label">Palm</span>
    </div>
    <div class="reach-guide__item">
      <svg class="reach-guide__icon" aria-hidden="true"><use href="#reach-icon-fist"/></svg>
      <span class="reach-guide__label">Fist</span>
    </div>
  </div>
  <div class="reach-onboard" id="reach-onboard" aria-hidden="true">
    <span class="reach-onboard__line">
      <svg class="reach-onboard__icon" aria-hidden="true"><use href="#reach-icon-palm"/></svg>
      <span class="reach-onboard__text">Push <b>forward</b> to dive in</span>
    </span>
    <span class="reach-onboard__line">
      <svg class="reach-onboard__icon" aria-hidden="true"><use href="#reach-icon-palm"/></svg>
      <span class="reach-onboard__text">Pull <b>back</b> to fly out</span>
    </span>
    <span class="reach-onboard__line">
      <svg class="reach-onboard__icon" aria-hidden="true"><use href="#reach-icon-fist"/></svg>
      <span class="reach-onboard__text">Make a <b>fist</b> to hold still</span>
    </span>
  </div>

  <!-- Three.js r128 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
  (function () {
    'use strict';

    /* ══════════════════════════════════════════
       MOBILE DETECTION — decided once at load.
       Desktop path stays byte-for-byte identical when false.
    ══════════════════════════════════════════ */
    var IS_MOBILE = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches)
                    || window.innerWidth < 768;
    var MAX_TEX   = 1024;             // mobile: downscale textures to this long edge
    var MOBILE_SLOTS      = 60;       // mobile: frames drawn in the field
    var MOBILE_TEX_BUDGET = 30;       // mobile: distinct reel images loaded (frames reuse these)

    /* ══════════════════════════════════════════
       CONFIG
    ══════════════════════════════════════════ */
    var REEL_COUNT   = /* @REEL-COUNT */ 99;            // images in assets/reel/ — the Admin rewrites this number (keep the marker). See ADR 0004.
    var SLOTS        = 101;           // floating frames in the field (textures repeat) — bump for a denser void
    var CELL_X       = 120;           // wrap cell width  (world units)
    var CELL_Y       = 64;            // wrap cell height
    var CELL_Z       = 460;           // wrap cell depth — full scroll loop length
    var IMG_BASE_H   = 6.4;           // base frame height (world units)
    var CAM_FOV      = 55;
    var BG_COLOR     = 0x080808;
    var FOG_DENSITY  = 0.0105;        // depth falloff into black

    var PAN_SPEED    = 0.030;         // world units per dragged px
    var PAN_FRICTION = 0.93;          // drag inertia decay
    var SCROLL_SPEED = 0.050;         // depth per wheel deltaY unit

    // Mobile touch tuning
    var TOUCH_PAN_X   = 0.045;        // world units per horizontal dragged px (look)
    var TOUCH_FLY     = 0.060;        // depth per vertical dragged px (fly)
    var TOUCH_PINCH   = 0.090;        // depth per two-finger vertical px
    var FLY_FRICTION  = 0.92;         // vertical-swipe momentum decay
    var TAP_THRESHOLD = 8;            // px of movement that still counts as a tap
    var LERP_CAM     = 0.075;         // camera chase smoothing
    var SWAY_X       = 0.045;         // idle mouse sway (radians)
    var SWAY_Y       = 0.030;

    var FLOAT_AMP    = 0.22;          // frame bob amplitude

    var FOCUS_DIST   = 14;            // focused frame distance from camera
    var FOCUS_FILL   = 0.62;          // fraction of viewport the frame fills
    var FOCUS_EASE   = 0.085;         // focus tween smoothing
    var DIM_OPACITY  = 0.12;          // other frames while focused

    var INTRO_DUR    = 3000;          // ms — camera pull-back
    var INTRO_FROM   = -34;           // camera start (deep inside the field)
    var INTRO_TO     = 26;            // camera settle position

    // The Reach — opt-in hand-steering tunables (see ADR 0010)
    var REACH_PAN          = 0.55;
    var REACH_FLY          = 28.0;
    var REACH_REST_ZONE    = 0.07;
    var REACH_RETICLE_GAIN = 0.34;      // on-screen reticle travel per unit hand offset (was 0.18)
    var REACH_DETECTION_HZ = 30;
    var REACH_SMOOTH       = 0.35;
    var REACH_LOSS_HINT_MS = 2000;
    var REACH_CURL_OPEN_RATIO = 0.85;   // curl > this * calib.curl ⇒ clutched→open
    var REACH_CURL_FIST_RATIO = 0.55;   // curl < this * calib.curl ⇒ open→clutched
    var REACH_CLUTCH_DWELL_MS = 120;    // intention-dwell on clutch transitions
    var REACH_ONBOARD_MS      = 6000;   // how long the one-time guide cue lingers before fading

    // Mobile: a lighter field of evenly-spread frames.
    if (IS_MOBILE) SLOTS = MOBILE_SLOTS;
    if (IS_MOBILE) REACH_DETECTION_HZ = 18;   // throttle hand inference on phones

    // Touch devices get touch-appropriate hint wording.
    if (IS_MOBILE) {
      var hintInit = document.getElementById('void-hint');
      if (hintInit) hintInit.textContent = 'Drag · swipe · tap a frame';
    }

    /* ══════════════════════════════════════════
       SEEDED PSEUDO-RANDOM (LCG) — deterministic layout
    ══════════════════════════════════════════ */
    function makeRng(seed) {
      var s = (seed >>> 0) || 1;
      return function () {
        s = (Math.imul(1664525, s) + 1013904223) >>> 0;
        return s / 0xffffffff;
      };
    }

    /* ══════════════════════════════════════════
       FIELD LAYOUT — scattered slots inside one wrap cell
    ══════════════════════════════════════════ */
    // Mobile: a fixed, evenly-spread sample of reel indices.
    // Frame count and texture count are decoupled — frames reuse this sample.
    var mobileTexSample = null;
    if (IS_MOBILE) {
      mobileTexSample = new Array(MOBILE_TEX_BUDGET);
      for (var s = 0; s < MOBILE_TEX_BUDGET; s++) {
        mobileTexSample[s] = Math.floor(s * REEL_COUNT / MOBILE_TEX_BUDGET) % REEL_COUNT;
      }
    }

    var layouts = [];
    (function buildLayouts() {
      // R2 low-discrepancy sequence → evenly spread, organic-looking scatter
      // (plain seeded random produced diagonal streaks and clusters)
      var G1 = 0.7548776662466927;
      var G2 = 0.5698402909980532;

      for (var i = 0; i < SLOTS; i++) {
        var r = makeRng(i * 1013 + 71);
        r(); r(); r();                       // warm up — decorrelates nearby seeds

        var fx = (0.5 + i * G1) % 1;
        var fy = (0.5 + i * G2) % 1;
        var x  = (fx - 0.5) * CELL_X + (r() - 0.5) * 9;
        var y  = (fy - 0.5) * CELL_Y + (r() - 0.5) * 7;
        // Stratified depth — one frame per Z band, no empty gaps between layers
        var z  = -((i + 0.5) / SLOTS) * CELL_Z + (r() - 0.5) * (CELL_Z / SLOTS) * 0.9;

        // Keep dead-center clear so the logo reads during the intro
        if (Math.abs(x) < 8 && Math.abs(y) < 5) {
          x += (x < 0 ? -1 : 1) * 11;
        }

        layouts.push({
          x: x, y: y, z: z,
          rotY:       0,                    // flat collage — frames face the camera
          rotZ:       0,
          scale:      0.50 + r() * 1.30,    // 0.50 → 1.80 (strong size contrast)
          shade:      0.45 + r() * 0.55,    // brightness variety 0.45 → 1.0
          floatPhase: r() * Math.PI * 2,
          floatSpeed: 0.22 + r() * 0.38,
          // Desktop: cycle the reel. Mobile: pull from a fixed-size sample so
          // a denser field reuses a flat texture budget instead of loading more.
          tex: IS_MOBILE
                 ? mobileTexSample[i % MOBILE_TEX_BUDGET]
                 : i % REEL_COUNT
        });
      }
    })();

    /* ══════════════════════════════════════════
       THREE.JS SETUP
    ══════════════════════════════════════════ */
    var canvas = document.getElementById('void-canvas');
    var W = window.innerWidth;
    var H = window.innerHeight;

    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: !IS_MOBILE, powerPreference: 'high-performance' });
    // Cap pixel ratio harder on mobile to spare the GPU.
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_MOBILE ? 1.5 : 2));
    renderer.setSize(W, H);
    renderer.outputEncoding = THREE.sRGBEncoding;

    var scene = new THREE.Scene();
    scene.background = new THREE.Color(BG_COLOR);
    scene.fog = new THREE.FogExp2(BG_COLOR, FOG_DENSITY);

    var camera = new THREE.PerspectiveCamera(CAM_FOV, W / H, 0.1, 4000);
    camera.rotation.order = 'YXZ';

    var raycaster = new THREE.Raycaster();
    var pointerNDC = new THREE.Vector2();

    /* ══════════════════════════════════════════
       TEXTURE LOADING — reel images

       Desktop loads the whole reel (unchanged). Mobile loads only the
       distinct reel images its lighter field actually references, and
       downscales each to MAX_TEX on the long edge to cut GPU memory.
    ══════════════════════════════════════════ */
    var loadedN  = 0;
    var loader   = new THREE.TextureLoader();
    var fillEl   = document.getElementById('vl-fill');
    var countEl  = document.getElementById('vl-count');
    var reelTex  = new Array(REEL_COUNT).fill(null);

    // Which reel indices does the field actually need?
    var needed = [];
    (function collectNeeded() {
      var seen = {};
      for (var i = 0; i < layouts.length; i++) {
        var t = layouts[i].tex;
        if (!seen[t]) { seen[t] = true; needed.push(t); }
      }
      // Desktop: keep the original behaviour of loading the full reel in order.
      if (!IS_MOBILE) {
        needed = [];
        for (var k = 0; k < REEL_COUNT; k++) needed.push(k);
      }
    })();

    var TO_LOAD = needed.length;
    countEl.textContent = '0 / ' + TO_LOAD;   // reflect the real total up front

    function pad2(n) { return n < 10 ? '0' + n : '' + n; }

    // Mobile: shrink an oversized image onto an offscreen canvas so the
    // GPU never holds the full-resolution bitmap.
    function downscaleImage(img) {
      var w = img.naturalWidth || img.width;
      var h = img.naturalHeight || img.height;
      var long = Math.max(w, h);
      if (!IS_MOBILE || long <= MAX_TEX) return img;
      var s = MAX_TEX / long;
      var cw = Math.max(1, Math.round(w * s));
      var ch = Math.max(1, Math.round(h * s));
      var cnv = document.createElement('canvas');
      cnv.width = cw;
      cnv.height = ch;
      var ctx = cnv.getContext('2d');
      ctx.drawImage(img, 0, 0, cw, ch);
      return cnv;
    }

    function prepTex(tex) {
      // Swap in a downscaled bitmap on mobile before the texture uploads.
      if (IS_MOBILE && tex.image) {
        var small = downscaleImage(tex.image);
        if (small !== tex.image) {
          tex.image = small;
          tex.needsUpdate = true;
        }
      }
      tex.encoding  = THREE.sRGBEncoding;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.generateMipmaps = true;
      try { tex.anisotropy = renderer.capabilities.getMaxAnisotropy(); } catch (e) {}
      return tex;
    }

    function tick() {
      loadedN++;
      fillEl.style.transform = 'scaleX(' + (loadedN / TO_LOAD) + ')';
      countEl.textContent    = loadedN + ' / ' + TO_LOAD;
      if (loadedN >= TO_LOAD) buildScene();
    }

    for (var j = 0; j < needed.length; j++) {
      (function (idx) {
        loader.load('assets/reel/' + pad2(idx + 1) + '.webp', function (tex) {
          reelTex[idx] = prepTex(tex);
          tick();
        }, undefined, tick); // count errors too so loader never stalls
      })(needed[j]);
    }

    /* ══════════════════════════════════════════
       FRAME MATERIAL — textured plane with RGB-split
       (chromatic aberration) driven by movement speed.
       Frames only; the rest of the page is untouched.
    ══════════════════════════════════════════ */
    var FRAME_VERT = [
      'varying vec2 vUv;',
      '#include <fog_pars_vertex>',
      'void main() {',
      '  vUv = uv;',
      '  vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);',
      '  gl_Position = projectionMatrix * mvPosition;',
      '  #include <fog_vertex>',
      '}'
    ].join('\n');

    var FRAME_FRAG = [
      'uniform sampler2D map;',
      'uniform float uShift;',
      'uniform float uShade;',
      'uniform float uOpacity;',
      'varying vec2 vUv;',
      '#include <fog_pars_fragment>',
      'void main() {',
      '  vec2 off = vec2(uShift, uShift * -0.6);',
      '  float r = texture2D(map, vUv + off).r;',
      '  float g = texture2D(map, vUv).g;',
      '  float b = texture2D(map, vUv - off).b;',
      '  gl_FragColor = vec4(vec3(r, g, b) * uShade, uOpacity);',
      '  #include <fog_fragment>',
      '}'
    ].join('\n');

    function makeFrameMaterial(tex, shade) {
      var uniforms = THREE.UniformsUtils.merge([
        THREE.UniformsLib.fog,
        {
          map:      { value: null },
          uShift:   { value: 0 },
          uShade:   { value: 1 },
          uOpacity: { value: 1 }
        }
      ]);
      uniforms.map.value    = tex;   // set after merge (merge would clone the texture)
      uniforms.uShade.value = shade;

      return new THREE.ShaderMaterial({
        uniforms:       uniforms,
        vertexShader:   FRAME_VERT,
        fragmentShader: FRAME_FRAG,
        fog:            true,
        transparent:    true,
        side:           THREE.FrontSide
      });
    }

    /* ══════════════════════════════════════════
       SCENE BUILD
    ══════════════════════════════════════════ */
    var meshes = [];

    function buildScene() {
      // ── Floating frames ──
      for (var i = 0; i < SLOTS; i++) {
        var L   = layouts[i];
        var tex = reelTex[L.tex];
        if (!tex) continue;

        // tex.image may be an <img> (naturalWidth) or, on mobile, a downscaled
        // <canvas> (width/height only) — handle both so aspect is never NaN.
        var iw = tex.image.naturalWidth  || tex.image.width;
        var ih = tex.image.naturalHeight || tex.image.height;
        var aspect = iw / ih;
        var h = IMG_BASE_H * L.scale;
        var w = h * aspect;

        var geo = new THREE.PlaneGeometry(w, h);
        var mat = makeFrameMaterial(tex, L.shade);

        var mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(L.x, L.y, L.z);
        mesh.rotation.y = L.rotY;
        mesh.rotation.z = L.rotZ;
        mesh.userData = { layout: L, baseW: w, baseH: h };
        scene.add(mesh);
        meshes.push(mesh);
      }

      startIntro();
    }

    /* ══════════════════════════════════════════
       STATE
    ══════════════════════════════════════════ */
    var cam       = { x: 0, y: 0, z: 0 };       // actual camera position
    var camTarget = { x: 0, y: 0, z: 0 };       // chased target
    var panVX = 0, panVY = 0;                   // drag inertia
    var zVel  = 0;                              // mobile vertical-swipe fly momentum
    var mouseNX = 0, mouseNY = 0;               // -1..1 idle sway
    var isDragging  = false;
    var dragMoved   = 0;
    var downX = 0, downY = 0, downT = 0;
    var lastPX = 0, lastPY = 0;
    var introDone = false;
    var clock = new THREE.Clock();
    var rgbShift = 0;                           // current RGB-split strength
    var navEl = document.querySelector('.nav');

    // Focus state
    var focused   = null;     // mesh
    var focusT    = 0;        // 0 = free, 1 = locked front-and-center
    var focusGoal = 0;        // tween target (0 or 1)
    var focusFrom = { x: 0, y: 0, z: 0, ry: 0, rz: 0 };
    var focusFit  = 1;

    /* ══════════════════════════════════════════
       INTRO — huge logo over the field, camera pulls
       back while the logo settles to its resting size
    ══════════════════════════════════════════ */
    function startIntro() {
      var loaderEl = document.getElementById('void-loader');
      loaderEl.classList.add('is-fading');
      setTimeout(function () { loaderEl.style.display = 'none'; }, 950);

      cam.z = camTarget.z = INTRO_FROM;

      setTimeout(function () {
        // CSS scales the logo 4.0 → 1 on the same curve & duration
        document.getElementById('void-center').classList.add('is-settled');

        var t0 = performance.now();
        function tickIntro(now) {
          var t = Math.min((now - t0) / INTRO_DUR, 1);
          var e = 1 - Math.pow(1 - t, 4);           // quartic ease-out
          camTarget.z = INTRO_FROM + (INTRO_TO - INTRO_FROM) * e;

          if (t < 1) {
            requestAnimationFrame(tickIntro);
          } else {
            introDone = true;
            var hintEl = document.getElementById('void-hint');
            hintEl.classList.add('is-visible');
            setTimeout(function () { hintEl.classList.remove('is-visible'); }, 6000);
            showReachCta();
          }
        }
        requestAnimationFrame(tickIntro);
      }, 450);
    }

    /* ══════════════════════════════════════════
       FOCUS — click a frame, it glides front-and-center
    ══════════════════════════════════════════ */
    function setFocus(mesh) {
      // Instantly restore any previously focused frame
      if (focused && focused !== mesh) {
        focused.renderOrder = 0;
        focused.material.depthTest = true;
        focused.scale.set(1, 1, 1);
      }
      focused   = mesh;
      focusGoal = 1;
      focusT    = 0;

      focusFrom.x  = mesh.position.x;
      focusFrom.y  = mesh.position.y;
      focusFrom.z  = mesh.position.z;
      focusFrom.ry = mesh.rotation.y;
      focusFrom.rz = mesh.rotation.z;

      // Scale so the frame fills FOCUS_FILL of the viewport at FOCUS_DIST
      var visH = 2 * FOCUS_DIST * Math.tan(THREE.Math.degToRad(CAM_FOV) / 2);
      var visW = visH * camera.aspect;
      var fitH = (visH * FOCUS_FILL) / mesh.userData.baseH;
      var fitW = (visW * 0.78) / mesh.userData.baseW;
      focusFit = Math.min(fitH, fitW);

      mesh.renderOrder = 999;
      mesh.material.depthTest = false;

      document.body.classList.add('is-focused');
    }

    function releaseFocus() {
      if (!focused) return;
      focusGoal = 0;
      document.body.classList.remove('is-focused');
    }

    /* Logo + CTAs disappear for good the moment the user starts exploring */
    var uiGone = false;
    function hideUiForever() {
      if (uiGone) return;
      uiGone = true;
      document.getElementById('void-center').classList.add('is-hidden');
    }

    function raycastFrames(clientX, clientY) {
      pointerNDC.x =  (clientX / W) * 2 - 1;
      pointerNDC.y = -(clientY / H) * 2 + 1;
      raycaster.setFromCamera(pointerNDC, camera);
      var hits = raycaster.intersectObjects(meshes);
      return hits.length ? hits[0].object : null;
    }

    /* ══════════════════════════════════════════
       INPUT — WHEEL (depth)  [desktop only]
    ══════════════════════════════════════════ */
    if (!IS_MOBILE) {
      window.addEventListener('wheel', function (e) {
        e.preventDefault();
        if (!introDone) return;
        hideUiForever();
        if (focused) { releaseFocus(); return; }

        var raw = e.deltaY;
        if (e.deltaMode === 1) raw *= 28;
        else if (e.deltaMode === 2) raw *= 500;
        camTarget.z -= raw * SCROLL_SPEED;   // scroll down = deeper into the void
      }, { passive: false });
    }

    /* ══════════════════════════════════════════
       INPUT — POINTER (drag pan + click focus + hover)  [desktop only]
       Touch devices are driven by the dedicated touch block below so the
       two input systems never apply the same finger twice.
    ══════════════════════════════════════════ */
    function endPointer(e) {
      if (!isDragging) return;
      isDragging = false;
      document.body.classList.remove('is-dragging');

      var isClick = dragMoved < 7 && (performance.now() - downT) < 450;
      if (!isClick) return;

      var hit = raycastFrames(e.clientX, e.clientY);
      if (focused) {
        if (hit && hit !== focused) setFocus(hit);  // switch frames
        else releaseFocus();                         // click anywhere = let go
      } else if (hit) {
        setFocus(hit);
      }
    }

    if (!IS_MOBILE) {
      canvas.addEventListener('pointerdown', function (e) {
        if (!introDone) return;
        hideUiForever();
        isDragging = true;
        dragMoved  = 0;
        downX = lastPX = e.clientX;
        downY = lastPY = e.clientY;
        downT = performance.now();
        panVX = panVY = 0;
        document.body.classList.add('is-dragging');
      });

      window.addEventListener('pointermove', function (e) {
        mouseNX = (e.clientX / W) * 2 - 1;
        mouseNY = (e.clientY / H) * 2 - 1;

        // Nav peeks down only when the pointer nears the top edge
        if (e.clientY < 90) navEl.classList.add('is-peek');
        else if (!isDragging) navEl.classList.remove('is-peek');

        if (isDragging) {
          var dx = e.clientX - lastPX;
          var dy = e.clientY - lastPY;
          lastPX = e.clientX;
          lastPY = e.clientY;
          dragMoved += Math.abs(dx) + Math.abs(dy);

          if (!focused) {
            panVX = -dx * PAN_SPEED;
            panVY =  dy * PAN_SPEED;
            camTarget.x += panVX;
            camTarget.y += panVY;
          }
        } else if (introDone) {
          // Hover cursor
          var hit = raycastFrames(e.clientX, e.clientY);
          document.body.classList.toggle('is-hovering', !!hit && !focused);
        }
      });

      window.addEventListener('pointerup', endPointer);
      window.addEventListener('pointercancel', function () {
        isDragging = false;
        document.body.classList.remove('is-dragging');
      });
    }

    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') releaseFocus();
    });

    // Logo / links in the nav must never be draggable
    navEl.addEventListener('dragstart', function (e) { e.preventDefault(); });

    /* ══════════════════════════════════════════
       THE REACH — opt-in hand steering (ADR 0010)

       An additive writer to camTarget. The CTA below is the only enable
       path: no auto-enable, no hotkey, no URL param. Camera and model are
       not touched until the visitor presses it.
    ══════════════════════════════════════════ */
    var REACH_PREFERS_REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

    var reach = {
      enabled:      false,
      starting:    false,
      stream:      null,
      videoEl:     null,
      landmarker:  null,
      loopTimer:   null,
      hand:        null,    // smoothed { x, y, size, curl, curl345 } in normalised frame coords
      calib:       null,    // { x, y, size, curl } captured neutral
      calibSamples: null,
      clutched:    false,   // The clutch: fist pins depth (camTarget.z) while pan stays live
      clutchSince: 0,       // ts of first open→clutched candidate frame, for dwell
      openSince:   0,       // ts of first clutched→open candidate frame, for dwell
      recalibSizeOnNext: false,  // on clutched→open OR focus-exit, re-anchor calib.size (see ADR 0011)
      wasFocused:  false,   // tracks focus→unfocus edge so depth re-anchors when Focus releases
      lastSeenAt:  0,
      ctaEl:       null,
      indicatorEl: null,
      reticleEl:   null,
      hintEl:      null,
      hintShown:   false
    };
    var _reachLandmarkerPromise = null;

    function reachInitDom() {
      reach.ctaEl       = document.getElementById('reach-cta');
      reach.ctaLabelEl  = reach.ctaEl ? reach.ctaEl.querySelector('.reach-cta__label') : null;
      reach.guideEl     = document.getElementById('reach-guide');
      reach.onboardEl   = document.getElementById('reach-onboard');
      reach.indicatorEl = document.getElementById('reach-indicator');
      reach.reticleEl   = document.getElementById('reach-reticle');
      reach.hintEl      = document.getElementById('reach-hint');
      if (!reach.ctaEl) return;

      if (REACH_PREFERS_REDUCED) {
        // CSS already hides it, but make doubly sure we never wire it up.
        return;
      }

      reach.ctaEl.addEventListener('click', function () {
        if (reach.starting) return;
        if (reach.enabled) disableReach();
        else enableReach();
      });
    }

    function showReachCta() {
      if (REACH_PREFERS_REDUCED) return;
      if (!reach.ctaEl) return;
      reach.ctaEl.classList.add('is-visible');
    }

    function setReachCtaState(state) {
      if (!reach.ctaEl) return;
      reach.ctaEl.classList.remove('is-on', 'is-failed');
      var labelEl = reach.ctaLabelEl;
      if (state === 'on') {
        reach.ctaEl.classList.add('is-on');
        if (labelEl) labelEl.textContent = 'Release · Esc';
        reach.ctaEl.setAttribute('aria-pressed', 'true');
      } else if (state === 'failed-perm') {
        reach.ctaEl.classList.add('is-failed');
        if (labelEl) labelEl.textContent = 'Camera blocked';
        reach.ctaEl.setAttribute('aria-pressed', 'false');
      } else if (state === 'failed-model') {
        reach.ctaEl.classList.add('is-failed');
        if (labelEl) labelEl.textContent = 'Hand model failed';
        reach.ctaEl.setAttribute('aria-pressed', 'false');
      } else {
        if (labelEl) labelEl.textContent = 'The Reach';
        reach.ctaEl.setAttribute('aria-pressed', 'false');
      }
    }

    function loadHandLandmarker() {
      if (_reachLandmarkerPromise) return _reachLandmarkerPromise;
      _reachLandmarkerPromise = import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs')
        .then(function (vision) {
          return vision.FilesetResolver
            .forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm')
            .then(function (fileset) {
              return vision.HandLandmarker.createFromOptions(fileset, {
                baseOptions: {
                  modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
                  delegate: IS_MOBILE ? 'CPU' : 'GPU'
                },
                runningMode: 'VIDEO',
                numHands: 1
              });
            });
        })
        .catch(function (err) {
          _reachLandmarkerPromise = null;
          throw err;
        });
      return _reachLandmarkerPromise;
    }

    function enableReach() {
      if (reach.enabled || reach.starting) return;
      reach.starting = true;
      hideUiForever();

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        reach.starting = false;
        setReachCtaState('failed-perm');
        return;
      }

      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
        .then(function (stream) {
          reach.stream = stream;
          var v = document.createElement('video');
          v.autoplay    = true;
          v.muted       = true;
          v.playsInline = true;
          v.setAttribute('playsinline', '');   // iOS Safari needs the attribute too
          v.setAttribute('muted', '');
          // iOS Safari won't advance frames unless the element is in the DOM.
          v.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;top:0;left:0;';
          document.body.appendChild(v);
          v.srcObject   = stream;
          reach.videoEl = v;
          if (reach.indicatorEl) reach.indicatorEl.classList.add('is-on');
          if (reach.reticleEl)   reach.reticleEl.classList.add('is-on');
          return v.play().then(function () { return loadHandLandmarker(); });
        })
        .then(function (landmarker) {
          reach.landmarker  = landmarker;
          reach.enabled     = true;
          reach.starting    = false;
          reach.calib       = null;
          reach.calibSamples = [];
          reach.lastSeenAt  = performance.now();
          setReachCtaState('on');
          // The Reach is now live: the gesture guide replaces the
          // scroll/drag/click hint for as long as we are streaming.
          if (reach.guideEl) reach.guideEl.classList.add('is-visible');
          var voidHintOnEnable = document.getElementById('void-hint');
          if (voidHintOnEnable) voidHintOnEnable.classList.remove('is-visible');
          reachShowOnboard();
          reachScheduleDetection();
        })
        .catch(function (err) {
          var perm = !!(err && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError' || err.name === 'NotFoundError'));
          reachTeardown();
          setReachCtaState(perm ? 'failed-perm' : 'failed-model');
        });
    }

    function disableReach() {
      if (!reach.enabled && !reach.starting) return;
      reachTeardown();
      setReachCtaState('off');
    }

    function reachTeardown() {
      reach.enabled  = false;
      reach.starting = false;
      if (reach.loopTimer) { clearTimeout(reach.loopTimer); reach.loopTimer = null; }
      if (reach.stream) {
        var tracks = reach.stream.getTracks();
        for (var i = 0; i < tracks.length; i++) tracks[i].stop();
        reach.stream = null;
      }
      if (reach.videoEl) {
        try { reach.videoEl.pause(); } catch (e) {}
        reach.videoEl.srcObject = null;
        if (reach.videoEl.parentNode) reach.videoEl.parentNode.removeChild(reach.videoEl);
        reach.videoEl = null;
      }
      if (reach.indicatorEl) reach.indicatorEl.classList.remove('is-on');
      if (reach.reticleEl)   reach.reticleEl.classList.remove('is-on', 'is-pushing', 'is-clutched', 'is-palm', 'is-fist');
      if (reach.guideEl)     reach.guideEl.classList.remove('is-visible');
      reachClearHint();
      reachClearOnboard();
      reach.hand     = null;
      reach.clutched = false;
      reach.clutchSince = 0;
      reach.openSince   = 0;
      reach.recalibSizeOnNext = false;
      reach.wasFocused = false;
      reach.calib    = null;
      reach.calibSamples = null;
    }

    function reachScheduleDetection() {
      if (!reach.enabled) return;
      var interval = Math.max(16, Math.round(1000 / REACH_DETECTION_HZ));
      reach.loopTimer = setTimeout(function () {
        reachDetect();
        reachScheduleDetection();
      }, interval);
    }

    function reachDetect() {
      if (!reach.enabled || !reach.videoEl || !reach.landmarker) return;
      if (reach.videoEl.readyState < 2) return;
      var ts = performance.now();
      var result;
      try {
        result = reach.landmarker.detectForVideo(reach.videoEl, ts);
      } catch (e) { return; }
      var lms = result && result.landmarks && result.landmarks[0];
      if (!lms || !lms.length) {
        reach.hand = null;
        return;
      }
      reach.lastSeenAt = ts;

      // Palm centre ≈ middle-finger MCP (landmark 9). Mirror x for selfie view.
      var palm   = lms[9];
      var wrist  = lms[0];

      var palmX = 1 - palm.x;
      var palmY = palm.y;

      var dx = (1 - palm.x) - (1 - wrist.x);
      var dy = palm.y - wrist.y;
      var size = Math.sqrt(dx * dx + dy * dy);

      // Openness signals: mean tip→MCP distance, normalised by hand size.
      //   curl    — fingers 2-5 (index..pinky), used to set the calibrated
      //             neutral and to read overall hand openness.
      //   curl345 — fingers 3-5 (middle, ring, pinky) ONLY. This is the
      //             pinch/fist discriminator: a pinch curls the INDEX to meet
      //             the thumb but keeps 3-5 extended, a fist curls 3-5 too.
      //             Gating on curl345 means a pinch's curled index no longer
      //             looks like a partial fist and no longer blocks the pinch.
      var FINGER_LM = [[8, 5], [12, 9], [16, 13], [20, 17]];
      var curlSum = 0, curl345Sum = 0;
      for (var f = 0; f < FINGER_LM.length; f++) {
        var tip = lms[FINGER_LM[f][0]];
        var mcp = lms[FINGER_LM[f][1]];
        var fx = tip.x - mcp.x;
        var fy = tip.y - mcp.y;
        var fd = Math.sqrt(fx * fx + fy * fy);
        curlSum += fd;
        if (f >= 1) curl345Sum += fd;   // skip index (f === 0)
      }
      var curl    = (size > 1e-6) ? (curlSum / 4) / size : 0;
      var curl345 = (size > 1e-6) ? (curl345Sum / 3) / size : 0;

      // Calibration: average the first ~12 samples to set neutral
      if (!reach.calib) {
        reach.calibSamples.push({ x: palmX, y: palmY, size: size, curl: curl });
        if (reach.calibSamples.length >= 12) {
          var sx = 0, sy = 0, ss = 0, sc = 0, n = reach.calibSamples.length;
          for (var k = 0; k < n; k++) {
            sx += reach.calibSamples[k].x;
            sy += reach.calibSamples[k].y;
            ss += reach.calibSamples[k].size;
            sc += reach.calibSamples[k].curl;
          }
          reach.calib = { x: sx / n, y: sy / n, size: ss / n, curl: sc / n };
          reach.calibSamples = null;
        }
        return;
      }

      // Smoothed update
      var prev = reach.hand;
      var next = { x: palmX, y: palmY, size: size, curl: curl, curl345: curl345 };
      if (prev) {
        next.x       = prev.x       + (palmX     - prev.x)       * REACH_SMOOTH;
        next.y       = prev.y       + (palmY     - prev.y)       * REACH_SMOOTH;
        next.size    = prev.size    + (size      - prev.size)    * REACH_SMOOTH;
        next.curl    = prev.curl    + (curl      - prev.curl)    * REACH_SMOOTH;
        next.curl345 = prev.curl345 + (curl345   - prev.curl345) * REACH_SMOOTH;
      }
      reach.hand = next;

      // ADR 0011: on the first sample after a clutched→open transition, the
      // open-palm size anchor has drifted (visitor may have shifted distance,
      // or the hand was a fist a frame ago). Re-anchor calib.size to the
      // current smoothed size so the depth contribution starts from ~0 and
      // does not jerk the camera forward or backward.
      if (reach.recalibSizeOnNext) {
        reach.calib.size = next.size;
        reach.recalibSizeOnNext = false;
      }

      // Clutch state machine.
      //
      // Two named states: open and clutched. A fist (fingers 3-5 curled, low
      // curl345) pins depth; an open palm steers normally. Anything between is
      // ambiguous and produces no transition, so the previous state holds.
      //
      // Transitions are gated by hysteresis bands AND an intention-dwell of
      // REACH_CLUTCH_DWELL_MS so a stray curl during a normal steer does not
      // pin the camera under the visitor.
      var curlNeutral = reach.calib.curl;
      var openCurl    = curlNeutral * REACH_CURL_OPEN_RATIO;
      var fistCurl    = curlNeutral * REACH_CURL_FIST_RATIO;

      // Open ↔ clutched with intention-dwell. Fingers 3-5 are the discriminator:
      // a fist curls them (curl345 low), an open palm extends them.
      if (!reach.clutched) {
        if (next.curl345 < fistCurl) {
          if (!reach.clutchSince) reach.clutchSince = ts;
          else if (ts - reach.clutchSince >= REACH_CLUTCH_DWELL_MS) {
            reach.clutched    = true;
            reach.clutchSince = 0;
          }
        } else {
          reach.clutchSince = 0;
        }
        reach.openSince = 0;
      } else {
        if (next.curl345 > openCurl) {
          if (!reach.openSince) reach.openSince = ts;
          else if (ts - reach.openSince >= REACH_CLUTCH_DWELL_MS) {
            reach.clutched          = false;
            reach.openSince         = 0;
            reach.recalibSizeOnNext = true;   // ADR 0011: re-anchor on next sample
          }
        } else {
          reach.openSince = 0;
        }
        reach.clutchSince = 0;
      }
    }

    function reachApplyToTarget() {
      if (!reach.enabled) return;
      if (focused) {
        // Focus owns the camera; The Reach contributes nothing. Also clear
        // any clutch state so releasing Focus does not leave a stale clutch
        // ring on the reticle, even if the visitor's hand happened to be in
        // a fist at the moment Focus was entered.
        if (reach.clutched || reach.clutchSince || reach.openSince) {
          reach.clutched    = false;
          reach.clutchSince = 0;
          reach.openSince   = 0;
        }
        if (reach.reticleEl) reach.reticleEl.classList.remove('is-pushing', 'is-clutched', 'is-palm', 'is-fist');
        reach.wasFocused = true;
        return;
      }
      if (!reach.hand || !reach.calib) {
        var lostFor = reach.lastSeenAt ? (performance.now() - reach.lastSeenAt) : 0;
        var withinGrace = (lostFor <= REACH_LOSS_HINT_MS);
        if (reach.reticleEl) {
          reach.reticleEl.classList.remove('is-pushing');
          // Calibrating (or briefly lost): drop back to the plain circle
          // cursor — no gesture class until detection re-stabilises.
          reach.reticleEl.classList.remove('is-palm', 'is-fist');
          // Clutch ring survives short tracking losses (a sneeze, a flicker,
          // a missed frame) — only fade it once we have actually auto-released.
          if (!(withinGrace && reach.clutched)) {
            reach.reticleEl.classList.remove('is-clutched');
          }
        }
        if (reach.lastSeenAt && lostFor > REACH_LOSS_HINT_MS) {
          // Long loss: auto-release the clutch and queue a fresh calibration
          // of all four calib fields on re-detection — the visitor has
          // probably repositioned, so x/y/size/curl all need re-anchoring.
          if (reach.clutched || reach.calib) {
            reach.clutched          = false;
            reach.clutchSince       = 0;
            reach.openSince         = 0;
            reach.recalibSizeOnNext = false;
            reach.calib             = null;
            reach.calibSamples      = [];
          }
          reachShowHint();
        }
        return;
      }
      reachClearHint();

      // Just came out of Focus: the hand has almost certainly moved or changed
      // apparent size while the pinch/Focus held the camera, so re-anchor the
      // depth reference on the next sample — the same trick the clutch uses
      // (ADR 0011). Without this, resuming from Focus jerks z forward/back.
      if (reach.wasFocused) {
        reach.wasFocused = false;
        reach.recalibSizeOnNext = true;
      }

      var ox = reach.hand.x - reach.calib.x;
      var oy = reach.hand.y - reach.calib.y;
      var r  = Math.sqrt(ox * ox + oy * oy);

      if (reach.reticleEl) {
        // Reticle travel: REACH_RETICLE_GAIN px of cursor movement per unit of
        // hand offset, clamped to ±42% of the short edge so a high gain still
        // can't fling the cursor off-screen.
        var reticleSpan = Math.min(W, H);
        var reticleMax  = reticleSpan * 0.42;
        var dxPx = (ox / 0.4) * reticleSpan * REACH_RETICLE_GAIN;
        var dyPx = (oy / 0.4) * reticleSpan * REACH_RETICLE_GAIN;
        dxPx = Math.max(-reticleMax, Math.min(reticleMax, dxPx));
        dyPx = Math.max(-reticleMax, Math.min(reticleMax, dyPx));
        reach.reticleEl.style.transform = 'translate(' + dxPx + 'px,' + dyPx + 'px)';
        if (r > REACH_REST_ZONE) reach.reticleEl.classList.add('is-pushing');
        else reach.reticleEl.classList.remove('is-pushing');
        if (reach.clutched) reach.reticleEl.classList.add('is-clutched');
        else reach.reticleEl.classList.remove('is-clutched');
        // Morph the cursor to match the visitor's current gesture: fist while
        // clutched, open palm otherwise. Calibration / loss branches above
        // clear both classes.
        reach.reticleEl.classList.toggle('is-fist',  reach.clutched);
        reach.reticleEl.classList.toggle('is-palm', !reach.clutched);
      }

      if (r > REACH_REST_ZONE) {
        var scale = (r - REACH_REST_ZONE) / r;
        // Pan: mirror the existing drag sign — hand right ⇒ camera looks right
        camTarget.x += -ox * scale * REACH_PAN;
        camTarget.y +=  oy * scale * REACH_PAN;
      }

      // Depth: bigger hand ⇒ closer to camera ⇒ fly forward (z decreases).
      // Depth is pinned (skip the contribution) when:
      //   - clutched: the visitor has committed a depth, or
      //   - recalibSizeOnNext: a re-anchor is pending (clutch release or Focus
      //     exit) — hold z for the frame or two until calib.size catches up.
      // Pan keeps writing in all of these; any prior zVel coasts on FLY_FRICTION.
      if (!reach.clutched && !reach.recalibSizeOnNext) {
        var ds = reach.hand.size - reach.calib.size;
        if (Math.abs(ds) > 0.008) {
          camTarget.z -= ds * REACH_FLY;
        }
      }
    }

    function reachShowHint() {
      if (reach.hintShown || !reach.hintEl) return;
      reach.hintShown = true;
      reach.hintEl.classList.add('is-visible');
    }
    function reachClearHint() {
      if (!reach.hintShown || !reach.hintEl) return;
      reach.hintShown = false;
      reach.hintEl.classList.remove('is-visible');
    }

    // One-time guide cue: fades in on enable, then fades itself out after a
    // few seconds. Self-arming timer so it never lingers across a teardown.
    function reachShowOnboard() {
      if (!reach.onboardEl) return;
      if (reach.onboardTimer) { clearTimeout(reach.onboardTimer); reach.onboardTimer = null; }
      reach.onboardEl.classList.add('is-visible');
      reach.onboardTimer = setTimeout(reachClearOnboard, REACH_ONBOARD_MS);
    }
    function reachClearOnboard() {
      if (reach.onboardTimer) { clearTimeout(reach.onboardTimer); reach.onboardTimer = null; }
      if (reach.onboardEl) reach.onboardEl.classList.remove('is-visible');
    }

    // Esc and tab-hide also disable The Reach (Esc additionally releases Focus
    // via the existing keydown listener above — both run, which is fine).
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && reach.enabled) disableReach();
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && reach.enabled) disableReach();
    });

    reachInitDom();

    /* ══════════════════════════════════════════
       INPUT — TOUCH
    ══════════════════════════════════════════ */
    if (!IS_MOBILE) {
      /* Desktop touchscreens: keep the original two-finger depth gesture,
         byte-for-byte the same as before this mobile pass. */
      var touchY0 = 0;
      window.addEventListener('touchstart', function (e) {
        if (e.touches.length === 2) touchY0 = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      }, { passive: true });

      window.addEventListener('touchmove', function (e) {
        // Two-finger vertical drag = depth scroll
        if (e.touches.length === 2 && introDone && !focused) {
          hideUiForever();
          var yNow = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          camTarget.z -= (touchY0 - yNow) * 0.12;
          touchY0 = yNow;
        }
      }, { passive: true });
    } else {
      /* ── Mobile gesture model (unified — replaces pointer + two-finger) ──
         · one finger: horizontal drag = look/pan X, vertical drag = fly
           forward/back through the void (with release momentum)
         · two fingers: vertical average = fly (same depth channel)
         · tap (< TAP_THRESHOLD px, quick): focus / release a frame        */
      var tStartX = 0, tStartY = 0, tStartT = 0;
      var tLastX  = 0, tLastY  = 0;
      var tMoved  = 0;
      var tPinch  = false;        // gesture began / became multi-touch
      var tPinchY0 = 0;
      var lastVZ  = 0;            // last-frame vertical delta → momentum seed

      canvas.addEventListener('touchstart', function (e) {
        if (!introDone) return;
        zVel = 0;                 // a new touch cancels fly momentum
        if (e.touches.length >= 2) {
          tPinch  = true;
          tPinchY0 = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          return;
        }
        var t = e.touches[0];
        tStartX = tLastX = t.clientX;
        tStartY = tLastY = t.clientY;
        tStartT = performance.now();
        tMoved  = 0;
        lastVZ  = 0;
        tPinch  = false;
        document.body.classList.add('is-dragging');
      }, { passive: true });

      canvas.addEventListener('touchmove', function (e) {
        if (!introDone) return;
        // Block pull-to-refresh / page scroll while exploring the canvas.
        if (e.cancelable) e.preventDefault();
        hideUiForever();

        if (e.touches.length >= 2) {
          // Two-finger vertical average drives depth.
          tPinch = true;
          var yAvg = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          if (!focused) {
            // Swipe up (yAvg decreasing) → fly forward (z decreases).
            var dz2 = (yAvg - tPinchY0) * TOUCH_PINCH;  // up → dz2<0 → forward
            camTarget.z += dz2;
            lastVZ = dz2;
          }
          tPinchY0 = yAvg;
          return;
        }
        if (tPinch) return;       // ignore the leftover finger after a pinch

        var t  = e.touches[0];
        var dx = t.clientX - tLastX;
        var dy = t.clientY - tLastY;
        tLastX = t.clientX;
        tLastY = t.clientY;
        // Track furthest displacement from the start so a tap stays a tap.
        var disp = Math.max(Math.abs(t.clientX - tStartX), Math.abs(t.clientY - tStartY));
        if (disp > tMoved) tMoved = disp;

        if (focused) return;      // while focused, a tap releases — no fly/pan

        // Horizontal = look/pan X (matches desktop drag sign).
        camTarget.x += -dx * TOUCH_PAN_X;
        // Vertical = fly: swipe up (dy<0) → forward (z decreases), down → back.
        var dz = dy * TOUCH_FLY;   // dy<0 → dz<0 → camTarget.z decreases → forward
        camTarget.z += dz;
        lastVZ = dz;               // remember this frame's z-delta for momentum
      }, { passive: false });

      function endTouch(e) {
        if (!introDone) return;
        document.body.classList.remove('is-dragging');

        // Still fingers down (e.g. lifted one of two)? keep gesture alive.
        if (e.touches && e.touches.length > 0) return;

        var dt   = performance.now() - tStartT;
        var moved = tMoved;
        var wasPinch = tPinch;
        tPinch = false;

        // Tap → focus / release a frame.
        if (!wasPinch && moved < TAP_THRESHOLD && dt < 450) {
          var hit = raycastFrames(tStartX, tStartY);
          if (focused) {
            if (hit && hit !== focused) setFocus(hit);
            else releaseFocus();
          } else if (hit) {
            setFocus(hit);
          }
          zVel = 0;
          return;
        }

        // Otherwise: hand vertical velocity to fly momentum.
        if (!focused) zVel = lastVZ;
      }
      canvas.addEventListener('touchend', endTouch, { passive: true });
      canvas.addEventListener('touchcancel', function (e) {
        document.body.classList.remove('is-dragging');
        tPinch = false;
        if (!e.touches || e.touches.length === 0) zVel = 0;
      }, { passive: true });
    }

    /* ══════════════════════════════════════════
       RESIZE
    ══════════════════════════════════════════ */
    window.addEventListener('resize', function () {
      W = window.innerWidth;
      H = window.innerHeight;
      renderer.setSize(W, H);
      camera.aspect = W / H;
      camera.updateProjectionMatrix();
    });

    /* ══════════════════════════════════════════
       INFINITE WRAP — keep every frame within half a
       cell of the camera on all three axes
    ══════════════════════════════════════════ */
    function wrap(value, center, size) {
      var d = value - center;
      d = ((d % size) + size * 1.5) % size - size * 0.5;
      return center + d;
    }

    /* ══════════════════════════════════════════
       RENDER LOOP
    ══════════════════════════════════════════ */
    function render() {
      requestAnimationFrame(render);
      var time = clock.getElapsedTime();

      // Drag inertia after release
      if (!isDragging && !focused) {
        panVX *= PAN_FRICTION;
        panVY *= PAN_FRICTION;
        if (Math.abs(panVX) > 0.0005) camTarget.x += panVX;
        if (Math.abs(panVY) > 0.0005) camTarget.y += panVY;
      }

      // Mobile vertical-swipe fly momentum (zVel is a per-frame z-delta)
      if (Math.abs(zVel) > 0.0008) {
        if (!focused) camTarget.z += zVel;
        zVel *= FLY_FRICTION;
      } else {
        zVel = 0;
      }

      // The Reach contributes its per-frame deltas to camTarget here, so it
      // inherits the chase, inertia, focus tween, and idle sway for free.
      reachApplyToTarget();

      // Camera chase
      cam.x += (camTarget.x - cam.x) * LERP_CAM;
      cam.y += (camTarget.y - cam.y) * LERP_CAM;
      cam.z += (camTarget.z - cam.z) * LERP_CAM;
      camera.position.set(cam.x, cam.y, cam.z);

      // Idle mouse sway (eased, reduced while focused)
      var swayMul = focused ? 0.25 : 1;
      camera.rotation.y += ((-mouseNX * SWAY_X * swayMul) - camera.rotation.y) * 0.05;
      camera.rotation.x += ((-mouseNY * SWAY_Y * swayMul) - camera.rotation.x) * 0.05;

      // Focus tween progress
      focusT += (focusGoal - focusT) * FOCUS_EASE;
      if (focused && focusGoal === 0 && focusT < 0.01) {
        // Fully released — restore
        focused.renderOrder = 0;
        focused.material.depthTest = true;
        focused = null;
        focusT  = 0;
      }
      var fe = focusT < 0.5
        ? 4 * focusT * focusT * focusT
        : 1 - Math.pow(-2 * focusT + 2, 3) / 2;     // cubic in-out

      // RGB split strength — fast drags and fast scroll-throughs split the channels
      var zSpeed    = Math.abs(camTarget.z - cam.z);
      var dragSpeed = Math.sqrt(panVX * panVX + panVY * panVY);
      var rgbTarget = Math.min(0.028, zSpeed * 0.0007 + dragSpeed * 0.020);
      rgbShift += (rgbTarget - rgbShift) * 0.10;

      // Frame updates
      for (var i = 0; i < meshes.length; i++) {
        var m = meshes[i];
        var L = m.userData.layout;

        if (m === focused) {
          // Glide to a point straight ahead of the camera
          var tx = cam.x;
          var ty = cam.y;
          var tz = cam.z - FOCUS_DIST;
          m.position.x = focusFrom.x + (tx - focusFrom.x) * fe;
          m.position.y = focusFrom.y + (ty - focusFrom.y) * fe;
          m.position.z = focusFrom.z + (tz - focusFrom.z) * fe;
          m.rotation.y = focusFrom.ry * (1 - fe);
          m.rotation.z = focusFrom.rz * (1 - fe);
          var s = 1 + (focusFit - 1) * fe;
          m.scale.set(s, s, 1);
          m.material.uniforms.uOpacity.value = 1;
          m.material.uniforms.uShift.value   = 0;   // focused frame stays clean
          // Lift shade to full brightness while focused
          m.material.uniforms.uShade.value = L.shade + (1 - L.shade) * fe;
          continue;
        }

        // Float bob + infinite wrap around the camera
        var fy = L.y + Math.sin(time * L.floatSpeed + L.floatPhase) * FLOAT_AMP;
        m.position.x = wrap(L.x, cam.x, CELL_X);
        m.position.y = wrap(fy,  cam.y, CELL_Y);
        m.position.z = wrap(L.z, cam.z - CELL_Z * 0.28, CELL_Z); // bias field ahead of camera
        m.rotation.y = L.rotY;
        m.rotation.z = L.rotZ;
        m.scale.set(1, 1, 1);
        m.material.uniforms.uShade.value = L.shade;

        // RGB split scales with proximity — frames flying past split hardest
        var dz   = Math.abs(m.position.z - cam.z);
        var prox = 1 - Math.min(1, dz / 120);
        m.material.uniforms.uShift.value = rgbShift * (0.25 + 0.75 * prox);

        // Dim everything else while a frame is focused
        var targetOp = focused ? DIM_OPACITY : 1;
        var u = m.material.uniforms.uOpacity;
        u.value += (targetOp - u.value) * 0.08;
      }

      renderer.render(scene, camera);
    }

    /* ══════════════════════════════════════════
       BOOT
    ══════════════════════════════════════════ */
    render();

  })();
  </script>
</body>
</html>
